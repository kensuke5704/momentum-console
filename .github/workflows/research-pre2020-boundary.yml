name: Research pre-2020 PIT boundary

on:
  push:
    branches: [research/pre2020-boundary-20260829]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect bootstrap and 2019 PIT universe feasibility
        run: |
          npx tsx scripts/research-pre2020-boundary.ts | tee pre2020-boundary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pre2020-boundary
          path: pre2020-boundary.txt
