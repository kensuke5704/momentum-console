name: Temporary OAIW ANTW Sanity
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/chatgpt-oaiw-antw-sanity.ts
