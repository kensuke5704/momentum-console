name: Hybrid W25 validation
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-w25-validation.ts'
      - '.github/workflows/hybrid-w25-validation.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-w25-validation.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-w25-validation-result
          path: data/research/hybrid-w25-validation/result.json