name: Research N-PORT Acceptance Timestamp
on:
  push:
    branches: [research/execution-feasibility-audit-20260826]
    paths:
      - 'scripts/nport-acceptance-audit.ts'
      - '.github/workflows/research-nport-acceptance.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/nport-acceptance-audit.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nport-acceptance-audit
          path: data/research/execution-feasibility/nport-acceptance.json
          retention-days: 30
