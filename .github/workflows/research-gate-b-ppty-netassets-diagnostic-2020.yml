name: Research Gate B PPTY Net Assets Diagnostic 2020
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - scripts/research-gate-b-ppty-netassets-diagnostic-2020.py
      - .github/workflows/research-gate-b-ppty-netassets-diagnostic-2020.yml
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-gate-b-ppty-netassets-diagnostic-2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-ppty-netassets-diagnostic-2020
          path: data/research/gate-b-ppty-netassets-diagnostic-2020.json
