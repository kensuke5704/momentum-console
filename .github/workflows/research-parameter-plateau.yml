name: Parameter Plateau

on:
  push:
    branches:
      - research/parameter-plateau-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run parameter plateau diagnostic
        run: node --import tsx scripts/parameter-plateau.ts
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-plateau
          path: data/research/parameter-plateau/
          retention-days: 30
