name: Research SEC Pre-ID v2.9 Context Diagnostic 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - "scripts/research-sec-preid-v29fix-removed-context-diagnostic-2006.py"
      - ".github/workflows/research-sec-preid-v29fix-context-diagnostic-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download old mixed-trust repaired pre-ID artifact
        run: |
          mkdir -p data/research /tmp/old
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9972690542/zip > /tmp/old.zip
          unzip -q /tmp/old.zip -d /tmp/old
          cp /tmp/old/sec-legacy-etf-series-source-preid-direct-2006.json data/research/sec-legacy-etf-series-source-preid-direct-old-2006.json
      - name: Capture exact filing context for removed candidates
        run: python3 scripts/research-sec-preid-v29fix-removed-context-diagnostic-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-preid-v29fix-removed-context-diagnostic-2006
          path: data/research/sec-preid-v29fix-removed-context-diagnostic-2006.json
          if-no-files-found: error
