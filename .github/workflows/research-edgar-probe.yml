name: Research EDGAR Probe
on:
  push:
    branches: ["research/live-nport-ingestion-20260826"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe SEC endpoints
        env:
          SEC_USER_AGENT: MomentumConsole/2.0 kensuke5704@users.noreply.github.com
        run: node --import tsx scripts/probe-edgar-index.ts
