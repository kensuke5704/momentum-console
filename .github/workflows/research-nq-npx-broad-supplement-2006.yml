name: Research NQ N-PX Broad Supplement 2006

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-npx-broad-fund-supplement-2006.py"
      - "scripts/research-npx-merge-master-2006.py"
      - "scripts/research-nq-npx-mapping-2006.py"
      - "scripts/research-nq-unmapped-diagnostics-2006.py"
      - ".github/workflows/research-nq-npx-broad-supplement-2006.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  supplement-remap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen successful 2006 baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/npx /tmp/nq
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9854517632/zip > /tmp/npx.zip
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9854510485/zip > /tmp/nq.zip
          unzip -q /tmp/npx.zip -d /tmp/npx
          unzip -q /tmp/nq.zip -d /tmp/nq
          cp /tmp/npx/npx-security-master-2006.json data/research/
          cp /tmp/nq/nq-pit-holdings-2006.json data/research/
      - name: Build broad-fund N-PX supplement
        run: python3 scripts/research-npx-broad-fund-supplement-2006.py
      - name: Merge baseline and supplement
        run: |
          python3 scripts/research-npx-merge-master-2006.py
          mv data/research/npx-security-master-2006.json data/research/npx-security-master-2006-baseline.json
          mv data/research/npx-security-master-2006-merged.json data/research/npx-security-master-2006.json
      - name: Re-run structural N-Q mapping
        run: python3 scripts/research-nq-npx-mapping-2006.py
      - name: Diagnose remaining unmapped holdings
        run: python3 scripts/research-nq-unmapped-diagnostics-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-npx-broad-supplement-2006
          path: |
            data/research/npx-security-master-broad-fund-supplement-2006.json
            data/research/npx-security-master-2006.json
            data/research/nq-npx-mapping-2006.json
            data/research/nq-npx-unmapped-diagnostics-2006.json
          if-no-files-found: warn
