name: Research NQ Legacy EC US Diagnostic 2006

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-nq-legacy-ec-us-diagnostic-2006.py"
      - "scripts/research-nq-series-segmentation-2006.py"
      - ".github/workflows/research-nq-legacy-ec-us-diagnostic-2006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose corrected EC and US structural evidence
        run: python3 scripts/research-nq-legacy-ec-us-diagnostic-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-legacy-ec-us-diagnostic-2006
          path: data/research/nq-legacy-ec-us-diagnostic-2006.json
          if-no-files-found: warn
