name: Research QQQ MA Sensitivity

on:
  push:
    branches:
      - research/qqq-ma-sensitivity-20260828
    paths:
      - scripts/audit-qqq-ma-sensitivity.ts
      - .github/workflows/research-qqq-ma-sensitivity.yml
      - src/lib/**
      - data/universe-history.json
      - public/data/market-data.json

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run QQQ MA sensitivity audit
        run: node --import tsx scripts/audit-qqq-ma-sensitivity.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qqq-ma-sensitivity
          path: data/research/qqq-ma-sensitivity.json
