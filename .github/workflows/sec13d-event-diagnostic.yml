name: SEC Schedule 13D event diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/sec13d-event-diagnostic.py'
      - '.github/workflows/sec13d-event-diagnostic.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb
      - run: python scripts/sec13d-event-diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec13d-event-diagnostic-result
          path: data/research/sec13d-event-diagnostic/result.json
