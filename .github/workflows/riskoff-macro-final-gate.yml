name: Risk-off macro final gate
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths: [scripts/riskoff-macro-final-gate.ts, .github/workflows/riskoff-macro-final-gate.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: |
          sed -i 's/cost:C,tax/cost:COST,tax/' scripts/riskoff-macro-final-gate.ts
          npx tsx scripts/riskoff-macro-final-gate.ts
      - uses: actions/upload-artifact@v4
        with: {name: riskoff-macro-final-gate-result, path: data/research/riskoff-macro-final-gate/result.json}