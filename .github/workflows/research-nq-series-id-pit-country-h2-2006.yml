name: Research N-Q Series-ID PIT Country H2 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2006-20260908"]
    paths:
      - "scripts/research-nq-series-id-pit-country-h2-2006.py"
      - ".github/workflows/research-nq-series-id-pit-country-h2-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  resolve-country:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen authoritative H1 country implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research-nq-hybrid-pit-country-gate-b-h1-2006.py)" = "7b830b0e851b0d5349a5c6049e8889f171b791e0"

      - name: Download frozen H2 mapping and source lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/mapping /tmp/source /tmp/base /tmp/struct
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10038597826/zip > /tmp/mapping.zip
          unzip -q /tmp/mapping.zip -d /tmp/mapping
          cp /tmp/mapping/nq-series-id-structural-mapping-h2-2006.json data/research/
          cp /tmp/mapping/npx-security-master-2006.json data/research/

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10038284691/zip > /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/source
          cp /tmp/source/sec-id-era-strict-series-source-h2-2006.json data/research/
          test "$(sha256sum data/research/sec-id-era-strict-series-source-h2-2006.json | awk '{print $1}')" = "f79f8d9e6d7fe45cb115a9c7f087dcca00622ff602cc0147e70e860f3528417d"

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9944538015/zip > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          cp /tmp/base/sec-submission-header-country-full-merged-2006.json data/research/

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9944797581/zip > /tmp/struct.zip
          unzip -q /tmp/struct.zip -d /tmp/struct
          cp /tmp/struct/structural-new-matches-submission-header-country-2006.json data/research/

      - name: Verify H2 mapping input lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/research/nq-series-id-structural-mapping-h2-2006.json').read_text())
          assert m['holdingsRunId']==34179821383
          assert m['holdingsArtifactId']==10038557328
          assert m['authoritativeH1MappingRunId']==34090287022
          assert m['authoritativeH1MappingArtifactId']==10006580498
          assert m['npxArtifactId']==9876020712
          expected=[
              ('2006-07','2006-07-31'),('2006-08','2006-08-31'),('2006-09','2006-09-29'),
              ('2006-10','2006-10-31'),('2006-11','2006-11-30'),('2006-12','2006-12-29'),
          ]
          assert [(s['signalMonth'],s['asOf']) for s in m['monthSnapshots']]==expected
          print('MAPPING_INPUT',json.dumps({
              'months':len(m['monthSnapshots']),
              'sourceSeriesCounts':[s['sourceSeriesCount'] for s in m['monthSnapshots']],
              'commonEquityCounts':[s['commonEquityHoldingCount'] for s in m['monthSnapshots']],
          }))
          PY

      - name: Compile H2 country wrapper
        run: python3 -m py_compile scripts/research-nq-series-id-pit-country-h2-2006.py

      - name: Resolve strict PIT country shard
        run: python3 scripts/research-nq-series-id-pit-country-h2-2006.py --mode resolve-shard --shard-index ${{ matrix.shard }} --shard-count 8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-series-id-country-h2-shard-${{ matrix.shard }}
          path: data/research/series-id-country-h2-shards/nq-hybrid-country-pit-shard-*.json
          if-no-files-found: error

  merge-country:
    needs: resolve-country
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen authoritative H1 country implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research-nq-hybrid-pit-country-gate-b-h1-2006.py)" = "7b830b0e851b0d5349a5c6049e8889f171b791e0"

      - name: Download frozen H2 mapping and source lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/mapping /tmp/source /tmp/base /tmp/struct
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10038597826/zip > /tmp/mapping.zip
          unzip -q /tmp/mapping.zip -d /tmp/mapping
          cp /tmp/mapping/nq-series-id-structural-mapping-h2-2006.json data/research/
          cp /tmp/mapping/npx-security-master-2006.json data/research/

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10038284691/zip > /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/source
          cp /tmp/source/sec-id-era-strict-series-source-h2-2006.json data/research/
          test "$(sha256sum data/research/sec-id-era-strict-series-source-h2-2006.json | awk '{print $1}')" = "f79f8d9e6d7fe45cb115a9c7f087dcca00622ff602cc0147e70e860f3528417d"

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9944538015/zip > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          cp /tmp/base/sec-submission-header-country-full-merged-2006.json data/research/

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9944797581/zip > /tmp/struct.zip
          unzip -q /tmp/struct.zip -d /tmp/struct
          cp /tmp/struct/structural-new-matches-submission-header-country-2006.json data/research/

      - uses: actions/download-artifact@v4
        with:
          pattern: nq-series-id-country-h2-shard-*
          path: data/research/series-id-country-h2-shards
          merge-multiple: true

      - name: Merge strict PIT country
        run: python3 scripts/research-nq-series-id-pit-country-h2-2006.py --mode merge

      - name: Audit no-lookahead and frozen period-extension invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          expected=[
              ('2006-07','2006-07-31'),('2006-08','2006-08-31'),('2006-09','2006-09-29'),
              ('2006-10','2006-10-31'),('2006-11','2006-11-30'),('2006-12','2006-12-29'),
          ]
          m=json.loads(Path('data/research/nq-series-id-structural-mapping-h2-2006.json').read_text())
          c=json.loads(Path('data/research/nq-series-id-country-pit-h2-2006.json').read_text())
          assert c['catalogSha256']=='f79f8d9e6d7fe45cb115a9c7f087dcca00622ff602cc0147e70e860f3528417d'
          assert c['sourceCatalogSha256']=='f79f8d9e6d7fe45cb115a9c7f087dcca00622ff602cc0147e70e860f3528417d'
          assert c['sourceCatalogArtifactId']==10038284691
          assert c['mappingRunId']==34180122700
          assert c['mappingArtifactId']==10038597826
          assert c['authoritativeH1CountryRunId']==34104858455
          assert c['authoritativeH1CountryArtifactId']==10012280475
          assert c['baseCountryEvidenceArtifactId']==9944538015
          assert c['structuralCountryEvidenceArtifactId']==9944797581
          assert [(s['signalMonth'],s['asOf']) for s in c['monthSnapshots']]==expected
          assert len(c['monthSnapshots'])==len(m['monthSnapshots'])==6

          max_evidence_date='0000-00-00'
          for ms,cs in zip(m['monthSnapshots'],c['monthSnapshots']):
              assert (ms['signalMonth'],ms['asOf'])==(cs['signalMonth'],cs['asOf'])
              assert ms['sourceSeriesCount']==cs['sourceSeriesCount']
              assert ms['commonEquityHoldingCount']==cs['commonEquityHoldingCount']
              assert len(ms['sourceFilings'])==len(cs['sourceFilings'])==cs['sourceSeriesCount']
              assert cs['corpPositiveNonCorpNameCount']==0
              counts=Counter()
              for filing in cs['sourceFilings']:
                  for h in filing.get('holdings',[]):
                      if h.get('legacyAssetSection')!='COMMON_EQUITY' or h.get('mappingStatus')!='MATCHED_UNIQUE':
                          continue
                      cls=h.get('countryClassification')
                      assert cls in {'US','NON_US','UNKNOWN'}
                      counts[cls]+=1
                      for ev in h.get('countryEvidence') or []:
                          ed=ev.get('evidenceDateFiled')
                          assert ed and ed<=cs['asOf']
                          max_evidence_date=max(max_evidence_date,ed)
                      new=h.get('countryResolutionEvidence')
                      if new:
                          ev=(new.get('resolutionEvidence') or {})
                          ed=ev.get('evidenceDateFiled')
                          if new.get('classification') in {'US','NON_US'}:
                              assert ed and ed<=cs['asOf']
                              max_evidence_date=max(max_evidence_date,ed)
              assert dict(counts)==cs['mappedCommonEquityCountryCounts']
              print('MONTH_COUNTRY_AUDIT',json.dumps({
                  'signalMonth':cs['signalMonth'],
                  'sourceSeriesCount':cs['sourceSeriesCount'],
                  'commonEquityHoldingCount':cs['commonEquityHoldingCount'],
                  'countryCounts':cs['mappedCommonEquityCountryCounts'],
                  'countryWeights':cs['mappedCommonEquityCountryWeights'],
                  'corpPositiveNonCorpNameCount':cs['corpPositiveNonCorpNameCount'],
              }))
          assert max_evidence_date<='2006-12-29'
          print('COUNTRY_AUDIT',json.dumps({
              'reasonCounts':c['reasonCounts'],
              'resolvedShardFileCount':c['resolvedShardFileCount'],
              'unresolvedIdentityDateInputCount':c['unresolvedIdentityDateInputCount'],
              'maxEvidenceDate':max_evidence_date,
          }))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-series-id-pit-country-h2-2006
          path: |
            data/research/nq-series-id-country-pit-h2-2006.json
            data/research/nq-series-id-country-extension-diagnostic-h2-2006.json
            data/research/nq-series-id-structural-mapping-h2-2006.json
            data/research/npx-security-master-2006.json
            data/research/sec-submission-header-country-full-merged-2006.json
            data/research/structural-new-matches-submission-header-country-2006.json
            data/research/series-id-country-h2-shards/*.json
          if-no-files-found: error
