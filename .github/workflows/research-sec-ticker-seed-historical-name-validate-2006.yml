name: Research SEC Ticker Seed Historical Name Validate 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-ticker-seed-historical-name-validate-2006.py"
      - ".github/workflows/research-sec-ticker-seed-historical-name-validate-2006.yml"
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download UNKNOWN retry merged country artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/src
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9902743513/zip > /tmp/src.zip
          unzip -q /tmp/src.zip -d /tmp/src
          cp /tmp/src/country-full-coverage-unknown-retry-2006.json data/research/
      - run: python3 scripts/research-sec-ticker-seed-historical-name-validate-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-ticker-seed-historical-name-validate-2006
          path: data/research/sec-ticker-seed-historical-name-validate-2006.json
