name: CPCM Equal Allocation Robustness

on:
  push:
    branches:
      - research/cpcm-allocation-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: equal_50_50_s20260825
            seed: 20260825
          - label: equal_50_50_s314159
            seed: 314159
          - label: equal_50_50_s271828
            seed: 271828
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject equal allocation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('scripts/chronology-preserving-conditional-mc.ts')
          s = p.read_text()
          s2, n = re.subn(r'w=conc\?\s*\.7\s*:\s*\.5', 'w=.5', s, count=1)
          if n != 1:
              raise SystemExit(f'allocation expression matches={n}')
          p.write_text(s2)
          PY
      - name: Run CPCM equal-allocation robustness
        env:
          CPCM_PATHS: 1000
          CPCM_LABEL: ${{ matrix.label }}
          CPCM_STOP: 0.175
          CPCM_RECOVERY_DAYS: 5
          CPCM_SEED: ${{ matrix.seed }}
        run: node --import tsx scripts/chronology-preserving-conditional-mc.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cpcm-${{ matrix.label }}-1000
          path: data/research/structural-monte-carlo/cpcm-${{ matrix.label }}.json
          retention-days: 30
