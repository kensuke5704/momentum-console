name: CPCM Allocation Scan

on:
  push:
    branches:
      - research/cpcm-allocation-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: adaptive_50_70
            base_weight: 0.50
            conc_weight: 0.70
          - label: equal_50_50
            base_weight: 0.50
            conc_weight: 0.50
          - label: adaptive_60_70
            base_weight: 0.60
            conc_weight: 0.70
          - label: adaptive_50_80
            base_weight: 0.50
            conc_weight: 0.80
          - label: adaptive_60_80
            base_weight: 0.60
            conc_weight: 0.80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject research allocation weights
        env:
          CPCM_BASE_WEIGHT: ${{ matrix.base_weight }}
          CPCM_CONC_WEIGHT: ${{ matrix.conc_weight }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('scripts/chronology-preserving-conditional-mc.ts')
          s = p.read_text()
          old = 'const conc=zg!=null&&zg>=.25,w=conc?.7:.5;'
          base = os.environ['CPCM_BASE_WEIGHT']
          conc = os.environ['CPCM_CONC_WEIGHT']
          new = f'const conc=zg!=null&&zg>=.25,w=conc?{conc}:{base};'
          if old not in s:
              raise SystemExit('allocation expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run CPCM allocation scan
        env:
          CPCM_PATHS: 300
          CPCM_LABEL: allocation_${{ matrix.label }}
          CPCM_STOP: 0.175
          CPCM_RECOVERY_DAYS: 5
          CPCM_SEED: 20260825
        run: node --import tsx scripts/chronology-preserving-conditional-mc.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cpcm-allocation-${{ matrix.label }}-300
          path: data/research/structural-monte-carlo/cpcm-allocation_${{ matrix.label }}.json
          retention-days: 30
