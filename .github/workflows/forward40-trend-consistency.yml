name: Forward40 trend consistency diagnostic
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-trend-consistency.yml
      - scripts/forward40-trend-consistency-diagnostic.ts
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/forward40-trend-consistency-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-trend-consistency-diagnostic
          path: data/research/forward40-trend-consistency-diagnostic/result.json
