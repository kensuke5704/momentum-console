name: Research Momentum v2.9 Authoritative H1 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - ".github/workflows/research-momentum-v2-9-authoritative-h1-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PREID_CANONICAL_ARTIFACT_ID: "9981960984"
      POSTID_QUALIFIED_ARTIFACT_ID: "9982681844"
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/pre /tmp/post
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${PREID_CANONICAL_ARTIFACT_ID}/zip" > /tmp/pre.zip
          unzip -q /tmp/pre.zip -d /tmp/pre
          cp "$(find /tmp/pre -type f -name 'sec-legacy-etf-series-source-preid-v29canonical-2006.json' | head -n1)" data/research/sec-legacy-etf-series-source-preid-v29canonical-2006.json
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${POSTID_QUALIFIED_ARTIFACT_ID}/zip" > /tmp/post.zip
          unzip -q /tmp/post.zip -d /tmp/post
          cp "$(find /tmp/post -type f -name 'sec-id-era-strict-series-source-h1-2006-v29qualified.json' | head -n1)" data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json

      - name: Requalify pre-ID occurrences on genuine complete-holdings markers
        env:
          PREID_CATALOG_PATH: data/research/sec-legacy-etf-series-source-preid-v29canonical-2006.json
        run: python3 scripts/research-sec-preid-genuine-schedule-qualify-v29.py

      - name: Rebuild exact-unique hybrid PIT catalog
        env:
          LEGACY_CATALOG_PATH: data/research/sec-legacy-etf-series-source-preid-v29genuine-2006.json
          ID_CATALOG_PATH: data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json
        run: python3 scripts/research-sec-hybrid-etf-source-catalog-h1-2006.py

      - name: Audit source identities before holdings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from collections import defaultdict
          from pathlib import Path
          root=Path('data/research')
          pre=json.loads((root/'sec-legacy-etf-series-source-preid-v29genuine-2006.json').read_text())
          hybrid=json.loads((root/'sec-hybrid-etf-source-catalog-h1-2006.json').read_text())
          names=[x.get('normalizedSeriesName','') for x in pre['positiveIdentities']]
          umbrella=[x for x in pre['positiveIdentities'] if x.get('normalizedSeriesName')=='ISHARES MSCI INDEX FUND']
          intl=[x for x in pre['positiveIdentities'] if x.get('normalizedSeriesName')=='INTERNATIONAL GROWTH FUND']
          alias=[]
          by=defaultdict(list)
          for x in pre['positiveIdentities']:
              n=x.get('normalizedSeriesName','')
              base=re.sub(r'^VANGUARD\s+','',n)
              if x.get('registrant','').upper().startswith('VANGUARD'):
                  by[(x['cik'],base)].append(n)
          for key,vals in by.items():
              if len(set(vals))>1: alias.append({'key':key,'names':sorted(set(vals))})
          audit={
            'prePositiveIdentityCount':pre['positiveIdentityCount'],
            'preSourceOccurrenceCount':pre['sourceOccurrenceCount'],
            'preRejectedIdentityCount':pre['genuineRejectedIdentityCount'],
            'preRejectedIdentityIds':pre['genuineRejectedIdentityIds'],
            'umbrellaIdentityCount':len(umbrella),
            'internationalGrowthCount':len(intl),
            'vanguardAliasGroupCount':len(alias),
            'hybridExactUniqueBridgeCount':hybrid['exactUniqueBridgeCount'],
            'hybridAmbiguousBridgeCount':hybrid['ambiguousBridgeCount'],
            'months':[{k:s[k] for k in ('signalMonth','sourceSeriesCount','legacySourceCount','seriesIdSourceCount','suppressedLegacyCount')} for s in hybrid['monthSnapshots']],
          }
          (root/'momentum-v2-9-authoritative-source-audit-h1-2006.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('SOURCE_AUDIT',json.dumps(audit),flush=True)
          if pre.get('genuineScheduleFetchErrorCount'): raise SystemExit('pre-ID genuine schedule fetch errors')
          if umbrella: raise SystemExit('umbrella iShares MSCI Index Fund survived genuine schedule qualification')
          if intl: raise SystemExit('International Growth false identity survived')
          if alias: raise SystemExit(f'Vanguard alias duplicates remain: {alias}')
          if hybrid['ambiguousBridgeCount'] != 0: raise SystemExit('ambiguous hybrid bridge')
          PY

      - name: Parse authoritative raw holdings
        env:
          CATALOG_PATH: data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          SOURCE_CATALOG_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-v29final.py

      - name: Audit authoritative holdings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          root=Path('data/research')
          raw=json.loads((root/'nq-pit-holdings-hybrid-h1-2006.json').read_text())
          zero={}; no_grouped={}; months=[]; methods=Counter(); bad=[]
          bad_re=re.compile(r'RESPECTIVELY|CAPITAL SHARE TRANSACTIONS|NET INCREASE|BEGINNING OF PERIOD|END OF PERIOD|TAX COST|UNREALIZED',re.I)
          for snap in raw['monthSnapshots']:
              status=Counter(row.get('parseStatus') for row in snap['sourceFilings'])
              common=0; common_sources=0
              for row in snap['sourceFilings']:
                  if row.get('parseMethod'): methods[row['parseMethod']]+=1
                  if row.get('parseStatus')=='PARSED_ZERO_HOLDINGS': zero[row.get('canonicalIdentity')]=row
                  if row.get('parseStatus')=='NO_GROUPED_SCHEDULE': no_grouped[row.get('canonicalIdentity')]=row
                  c=sum(h.get('legacyAssetSection')=='COMMON_EQUITY' for h in row.get('holdings',[]))
                  common+=c
                  if c: common_sources+=1
                  for h in row.get('holdings',[]):
                      if bad_re.search(str(h.get('description') or '')):
                          bad.append({'identity':row.get('canonicalIdentity'),'description':h.get('description')})
              months.append({'signalMonth':snap['signalMonth'],'sourceSeriesCount':len(snap['sourceFilings']),'parseStatusCounts':dict(status),'commonEquityHoldingCount':common,'commonEquitySourceCount':common_sources})
          ambiguous_assigned=[]
          for filing in raw.get('filingAudit',[]):
              for entry in filing.get('legacyAssignmentAudit') or []:
                  if entry.get('assignmentRule')=='AMBIGUOUS_EXACT_TARGETS' and entry.get('assignedIdentity'):
                      ambiguous_assigned.append({'accession':filing.get('accession'),'entry':entry})
          audit={
              'uniqueSourceFilingCount':raw.get('uniqueSourceFilingCount'),
              'filingFetchSuccessCount':raw.get('filingFetchSuccessCount'),
              'filingFetchErrorCount':raw.get('filingFetchErrorCount'),
              'uniqueParsedHoldingCount':raw.get('uniqueParsedHoldingCount'),
              'assetSectionCounts':raw.get('legacyAssetSectionCounts'),
              'parseMethodCountsAcrossSnapshots':dict(methods),
              'uniqueZeroHoldingTargetCount':len(zero),
              'uniqueNoGroupedTargetCount':len(no_grouped),
              'ambiguousAssignedMarkerCount':len(ambiguous_assigned),
              'badFinancialTextHoldingCount':len(bad),
              'zeroTargets':[{'canonicalIdentity':r.get('canonicalIdentity'),'seriesName':r.get('seriesName'),'registrant':r.get('registrant'),'form':r.get('form'),'sourceFilename':r.get('sourceFilename')} for r in zero.values()],
              'noGroupedTargets':[{'canonicalIdentity':r.get('canonicalIdentity'),'seriesName':r.get('seriesName'),'registrant':r.get('registrant'),'form':r.get('form'),'sourceFilename':r.get('sourceFilename')} for r in no_grouped.values()],
              'badExamples':bad[:20],
              'months':months,
          }
          (root/'momentum-v2-9-authoritative-holdings-audit-h1-2006.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('HOLDINGS_AUDIT',json.dumps({k:v for k,v in audit.items() if k not in {'zeroTargets','noGroupedTargets','badExamples','months'}}),flush=True)
          for row in months: print('MONTH',json.dumps(row),flush=True)
          for row in audit['zeroTargets']: print('ZERO',json.dumps(row),flush=True)
          for row in audit['noGroupedTargets']: print('NO_GROUPED',json.dumps(row),flush=True)
          if raw.get('filingFetchErrorCount'): raise SystemExit('filing fetch errors remain')
          if no_grouped: raise SystemExit(f'genuine-qualified source produced NO_GROUPED: {len(no_grouped)}')
          if zero: raise SystemExit(f'parser zero-holdings sources remain: {len(zero)}')
          if ambiguous_assigned: raise SystemExit('ambiguous marker was assigned')
          if bad: raise SystemExit(f'post-schedule financial text parsed as holdings: {len(bad)}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-authoritative-h1-2006
          path: |
            data/research/sec-legacy-etf-series-source-preid-v29genuine-2006.json
            data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json
            data/research/sec-hybrid-etf-source-catalog-h1-2006.json
            data/research/nq-pit-holdings-hybrid-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-h1-2006.json
            data/research/momentum-v2-9-authoritative-holdings-audit-h1-2006.json
          if-no-files-found: warn
