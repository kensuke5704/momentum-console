name: Cross-asset defensive diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/crossasset-defensive-diagnostic.ts
      - .github/workflows/crossasset-defensive-diagnostic.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/crossasset-defensive-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: crossasset-defensive-diagnostic-result
          path: data/research/crossasset-defensive-diagnostic/result.json
