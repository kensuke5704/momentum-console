name: Production allocation comparison
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/allocation-production-compare.ts'
      - '.github/workflows/allocation-production-compare.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/allocation-production-compare.ts
      - uses: actions/upload-artifact@v4
        with:
          name: allocation-production-compare-result
          path: data/research/allocation-production-compare/result.json