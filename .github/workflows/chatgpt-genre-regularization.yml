name: ChatGPT Genre Regularization

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run genre regularization backtest
        run: node --import tsx scripts/chatgpt-genre-regularization.ts
      - name: Upload genre regularization results
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-genre-regularization-results
          path: artifacts/genre-regularization-results.json
          if-no-files-found: error
