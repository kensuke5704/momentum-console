name: Research Gate B Independent Series Registry 2019
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - scripts/research-gate-b-independent-series-registry-2019.py
      - .github/workflows/research-gate-b-independent-series-registry-2019.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-gate-b-independent-series-registry-2019.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-b-independent-series-registry-2019
          path: data/research/gate-b-independent-series-registry-2019.json
          if-no-files-found: warn
