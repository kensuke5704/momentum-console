name: Research Momentum v2.9 Authoritative Source Final H1 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - ".github/workflows/research-momentum-v2-9-authoritative-source-final-h1-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  source-final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PREID_CANONICAL_ARTIFACT_ID: "9981960984"
      POSTID_QUALIFIED_ARTIFACT_ID: "9982681844"
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/pre /tmp/post
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${PREID_CANONICAL_ARTIFACT_ID}/zip" > /tmp/pre.zip
          unzip -q /tmp/pre.zip -d /tmp/pre
          cp "$(find /tmp/pre -type f -name 'sec-legacy-etf-series-source-preid-v29canonical-2006.json' | head -n1)" data/research/sec-legacy-etf-series-source-preid-v29canonical-2006.json
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${POSTID_QUALIFIED_ARTIFACT_ID}/zip" > /tmp/post.zip
          unzip -q /tmp/post.zip -d /tmp/post
          cp "$(find /tmp/post -type f -name 'sec-id-era-strict-series-source-h1-2006-v29qualified.json' | head -n1)" data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json
      - name: Genuine pre-ID schedule qualification
        env:
          PREID_CATALOG_PATH: data/research/sec-legacy-etf-series-source-preid-v29canonical-2006.json
        run: python3 scripts/research-sec-preid-genuine-schedule-qualify-v29.py
      - name: Exact unique hybrid catalog
        env:
          LEGACY_CATALOG_PATH: data/research/sec-legacy-etf-series-source-preid-v29genuine-2006.json
          ID_CATALOG_PATH: data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json
        run: python3 scripts/research-sec-hybrid-etf-source-catalog-h1-2006.py
      - name: Final source audit
        run: |
          python3 - <<'PY'
          import json,re
          from collections import defaultdict
          from pathlib import Path
          r=Path('data/research'); pre=json.loads((r/'sec-legacy-etf-series-source-preid-v29genuine-2006.json').read_text()); hy=json.loads((r/'sec-hybrid-etf-source-catalog-h1-2006.json').read_text())
          by=defaultdict(set)
          for x in pre['positiveIdentities']:
              if x.get('registrant','').upper().startswith('VANGUARD'):
                  n=x.get('normalizedSeriesName',''); by[(x['cik'],re.sub(r'^VANGUARD\s+','',n))].add(n)
          aliases=[{'key':list(k),'names':sorted(v)} for k,v in by.items() if len(v)>1]
          audit={'prePositiveIdentityCount':pre['positiveIdentityCount'],'preSourceOccurrenceCount':pre['sourceOccurrenceCount'],'rejectedIdentityIds':pre['genuineRejectedIdentityIds'],'umbrellaCount':sum(x.get('normalizedSeriesName')=='ISHARES MSCI INDEX FUND' for x in pre['positiveIdentities']),'internationalGrowthCount':sum(x.get('normalizedSeriesName')=='INTERNATIONAL GROWTH FUND' for x in pre['positiveIdentities']),'vanguardAliasGroupCount':len(aliases),'vanguardAliases':aliases,'exactUniqueBridgeCount':hy['exactUniqueBridgeCount'],'ambiguousBridgeCount':hy['ambiguousBridgeCount'],'months':[{k:s[k] for k in ('signalMonth','sourceSeriesCount','legacySourceCount','seriesIdSourceCount','suppressedLegacyCount')} for s in hy['monthSnapshots']]}
          (r/'momentum-v2-9-authoritative-source-audit-h1-2006.json').write_text(json.dumps(audit,indent=2)+'\n'); print('SOURCE_AUDIT',json.dumps(audit))
          assert pre['genuineScheduleFetchErrorCount']==0
          assert audit['umbrellaCount']==audit['internationalGrowthCount']==audit['vanguardAliasGroupCount']==hy['ambiguousBridgeCount']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-v2-9-authoritative-source-final-h1-2006
          path: |
            data/research/sec-legacy-etf-series-source-preid-v29genuine-2006.json
            data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json
            data/research/sec-hybrid-etf-source-catalog-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-h1-2006.json
          if-no-files-found: error
