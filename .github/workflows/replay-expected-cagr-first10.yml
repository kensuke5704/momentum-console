name: Replay expected CAGR first 100

on:
  push:
    branches: [research/expected-cagr-replay-first10-20260829]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/expected-cagr-replay-first10-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/replay-expected-cagr-first10.ts
      - uses: actions/upload-artifact@v4
        with:
          name: expected-cagr-first100-monthly
          path: |
            data/research/expected-cagr-replay/first100.json
            data/research/expected-cagr-replay/first100-monthly-10y.json
      - name: Persist first 100 monthly paths to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/expected-cagr-replay/first100.json data/research/expected-cagr-replay/first100-monthly-10y.json
          git commit -m "research: persist first 100 monthly bootstrap paths [skip ci]" || exit 0
          git push origin HEAD:research/expected-cagr-replay-first10-20260829
