name: Research Legacy Universe Reproducibility 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-legacy-universe-reproducibility-2020.py"
      - "scripts/research-ncsr-nport-overlap-2020.py"
      - "scripts/research-nq-pit-holdings-2006.py"
      - "scripts/research-legacy-holdings-parser.py"
      - ".github/workflows/research-legacy-universe-reproducibility-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate paired-series universe reproducibility
        run: python3 scripts/research-legacy-universe-reproducibility-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-universe-reproducibility-2020
          path: data/research/legacy-universe-reproducibility-2020.json
          if-no-files-found: warn
