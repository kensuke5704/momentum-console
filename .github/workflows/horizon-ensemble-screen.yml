name: Horizon ensemble screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths: [scripts/horizon-ensemble-screen.ts, .github/workflows/horizon-ensemble-screen.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/horizon-ensemble-screen.ts
      - uses: actions/upload-artifact@v4
        with: {name: horizon-ensemble-screen-result, path: data/research/horizon-ensemble-screen/result.json}