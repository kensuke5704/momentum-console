name: Research SEC Historical ETF Operational Evidence Pilot 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-historical-etf-operational-evidence-pilot-2006.py"
      - ".github/workflows/research-sec-historical-etf-operational-evidence-pilot-2006.yml"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test PIT ETF operational evidence rule
        run: python3 scripts/research-sec-historical-etf-operational-evidence-pilot-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-historical-etf-operational-evidence-pilot-2006
          path: data/research/sec-historical-etf-operational-evidence-pilot-2006.json
