name: Research Country Conservative Eligibility 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-country-conservative-eligibility-2006.py"
      - ".github/workflows/research-country-conservative-eligibility-2006.yml"
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/map /tmp/country /tmp/add
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9900708609/zip > /tmp/map.zip
          unzip -q /tmp/map.zip -d /tmp/map
          cp /tmp/map/nq-npx-structural-mapping-2006.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9902743513/zip > /tmp/country.zip
          unzip -q /tmp/country.zip -d /tmp/country
          cp /tmp/country/country-full-coverage-unknown-retry-2006.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9903255442/zip > /tmp/add.zip
          unzip -q /tmp/add.zip -d /tmp/add
          cp /tmp/add/structural-new-matches-country-2006.json data/research/
      - run: python3 scripts/research-country-conservative-eligibility-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: country-conservative-eligibility-2006
          path: data/research/country-conservative-eligibility-2006.json
