name: Tax-aware hysteresis research
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/tax-aware-hysteresis-walkforward.ts
      - .github/workflows/tax-aware-hysteresis.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/tax-aware-hysteresis-walkforward.ts
      - uses: actions/upload-artifact@v4
        with:
          name: tax-aware-hysteresis-result
          path: data/research/tax-aware-hysteresis/result.json
