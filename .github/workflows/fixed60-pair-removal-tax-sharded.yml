name: Fixed60 pair-removal tax sharded

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - scripts/fixed60-pair-removal-tax-shard.ts
      - .github/workflows/fixed60-pair-removal-tax-sharded.yml
  workflow_dispatch:

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-pair-removal-tax-shard.ts
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 8
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-pair-removal-shard-${{ matrix.shard }}
          path: data/research/fixed60-pair-removal-tax/shard-${{ matrix.shard }}/result.json

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fixed60-pair-removal-shard-*
          path: shards
          merge-multiple: false
      - name: Aggregate all pairs
        run: |
          python - <<'PY'
          import json,glob,os,math
          files=glob.glob('shards/**/result.json',recursive=True)
          docs=[json.load(open(f)) for f in files]
          rows=[r for d in docs for r in d['rows']]
          rows.sort(key=lambda r:r['afterTaxCagr'])
          vals=sorted(r['afterTaxCagr'] for r in rows)
          def q(p):
            if not vals:return None
            h=(len(vals)-1)*p;i=int(math.floor(h));f=h-i
            return vals[i]*(1-f)+vals[min(i+1,len(vals)-1)]*f
          expected=docs[0]['totalPairs'] if docs else None
          out={'validity':{'researchOnly':True,'trueOOS':False,'reselectionAfterRemoval':True,'parameterSearch':False,'falsificationOnly':True,'taxApproximation':'20.315% annual realized P&L with 3-year loss carry; not exact broker tax lots/withholding.'},'shardsFound':len(docs),'expectedPairs':expected,'pairCount':len(rows),'complete':expected==len(rows),'distribution':{'min':q(0),'p10':q(.1),'p25':q(.25),'median':q(.5),'p75':q(.75),'countBelow40':sum(v<.4 for v in vals),'shareAbove40':sum(v>=.4 for v in vals)/len(vals) if vals else None},'worst10':rows[:10]}
          os.makedirs('aggregate',exist_ok=True)
          json.dump(out,open('aggregate/result.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          if not out['complete']:raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-pair-removal-tax-aggregate
          path: aggregate/result.json
