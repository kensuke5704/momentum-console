name: Research Momentum v2.9 Authoritative Holdings Sharded v7 H1 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths: [".github/workflows/research-momentum-v2-9-authoritative-holdings-sharded-v7-h1-2006.yml"]
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_RUN_ID: "34024867963"
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - name: Wait for corrected source v6 and download
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            s=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}" --jq '.status'); c=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion // ""')
            echo "source status=$s conclusion=$c"
            if [ "$s" = completed ]; then [ "$c" = success ] || exit 1; break; fi
            sleep 5
          done
          aid=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[]|select(.name=="momentum-v2-9-authoritative-source-final-v6-h1-2006")|.id'|head -n1)
          [ -n "$aid" ] || exit 1
          mkdir -p data/research /tmp/src; gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${aid}/zip" >/tmp/src.zip; unzip -q /tmp/src.zip -d /tmp/src
          cp "$(find /tmp/src -name 'sec-hybrid-etf-source-catalog-h1-2006.json'|head -n1)" data/research/sec-hybrid-etf-source-catalog-h1-2006.json
      - name: Parse corrected filing shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "4"
          SOURCE_CATALOG_PATH: data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          SOURCE_CATALOG_RUN_ID: "34024867963"
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-v29-shard-v7.py
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-v2-9-holdings-v7-shard-${{ matrix.shard }}
          path: data/research/nq-pit-holdings-hybrid-h1-2006-shard-${{ matrix.shard }}.json
          if-no-files-found: error
  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download corrected source v6
        shell: bash
        run: |
          set -euo pipefail
          aid=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[]|select(.name=="momentum-v2-9-authoritative-source-final-v6-h1-2006")|.id'|head -n1)
          mkdir -p data/research /tmp/src; gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${aid}/zip" >/tmp/src.zip; unzip -q /tmp/src.zip -d /tmp/src
          cp "$(find /tmp/src -name 'sec-hybrid-etf-source-catalog-h1-2006.json'|head -n1)" data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          cp "$(find /tmp/src -name 'momentum-v2-9-authoritative-source-audit-v6-h1-2006.json'|head -n1)" data/research/momentum-v2-9-authoritative-source-audit-v6-h1-2006.json
      - uses: actions/download-artifact@v4
        with:
          pattern: momentum-v2-9-holdings-v7-shard-*
          path: data/research/shards
          merge-multiple: true
      - name: Merge exact filing shards
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-merge-shards-v6.py
      - name: Final structural audit
        run: python3 scripts/research-nq-authoritative-holdings-audit-v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-authoritative-holdings-sharded-v7-h1-2006
          path: |
            data/research/sec-hybrid-etf-source-catalog-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-v6-h1-2006.json
            data/research/nq-pit-holdings-hybrid-h1-2006.json
            data/research/momentum-v2-9-authoritative-holdings-audit-v5-h1-2006.json
          if-no-files-found: warn
