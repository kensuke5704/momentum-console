name: Hybrid circuit neighborhood
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-circuit-neighborhood.ts'
      - '.github/workflows/hybrid-circuit-neighborhood.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-circuit-neighborhood.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-circuit-neighborhood-result
          path: data/research/hybrid-circuit-neighborhood/result.json