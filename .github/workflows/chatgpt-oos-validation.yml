name: ChatGPT OOS Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate frozen OOS data
        run: npm run sync:oos
      - name: Validate project
        run: npm run check
      - name: Upload OOS snapshot
        uses: actions/upload-artifact@v4
        with:
          name: frozen-oos-snapshot
          path: public/data/oos-performance.json
          if-no-files-found: error
