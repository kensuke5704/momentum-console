name: Consensus75 event falsification
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/consensus75-event-falsification.ts
      - .github/workflows/consensus75-event-falsification.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/consensus75-event-falsification.ts
      - uses: actions/upload-artifact@v4
        with:
          name: consensus75-event-falsification-result
          path: data/research/consensus75-event-falsification/result.json
