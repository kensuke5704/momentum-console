name: Alpha Loss Decomposition

on:
  push:
    branches:
      - research/alpha-loss-decomposition-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run alpha loss decomposition
        run: node --import tsx scripts/alpha-loss-decomposition.ts
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-loss-decomposition
          path: data/research/alpha-loss/decomposition.json
          retention-days: 30
