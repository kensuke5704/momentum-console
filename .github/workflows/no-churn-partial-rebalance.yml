name: No-churn partial rebalance research
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/no-churn-partial-rebalance.ts
      - .github/workflows/no-churn-partial-rebalance.yml
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/no-churn-partial-rebalance.ts
      - uses: actions/upload-artifact@v4
        with:
          name: no-churn-partial-rebalance-result
          path: data/research/no-churn-partial-rebalance/result.json
