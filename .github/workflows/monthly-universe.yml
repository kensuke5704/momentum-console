name: Refresh Point-in-Time Universe

on:
  workflow_dispatch:
  schedule:
    # 00:30 UTC is after the prior US month-end close and before the next US open.
    # Days 1-4 cover weekends/holidays while the fallback keeps trading active.
    - cron: "30 0 1-4 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Rebuild universes from the committed audited source snapshot
        run: npm run sync:universe && npm run sync:atlas
      - name: Commit auditable universe history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nport-operations.json data/universe-history.json public/data/universe-history.json public/data/universe-current.json public/data/atlas-layout.json
          git diff --cached --quiet || git commit -m "Update point-in-time Dynamic Universe"
          git push
