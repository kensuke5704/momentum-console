name: Deploy Momentum Console

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 22:20 UTC is after the US close in both EST (17:20) and EDT (18:20).
    - cron: "20 22 * * 1-5"
    # Pre-open refresh publishes a month-start fallback or delayed N-PORT plan.
    - cron: "30 8 * * 1-5"
    # Retry completed daily bars before the next US open. 12:30 UTC remains
    # pre-open in both EDT (08:30) and EST (07:30).
    - cron: "30 10 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch market data
        env:
          # The final pre-open attempt fails visibly instead of deploying a
          # partial/stale risk transition when validated close data is absent.
          REQUIRE_LATEST_DAILY_CLOSE: ${{ github.event.schedule == '30 12 * * 1-5' }}
        run: npm run sync:data

      - name: Update Forward OOS with actual daily prices
        run: npm run sync:oos

      - name: Refresh semantic atlas when Universe changes
        run: npm run sync:atlas

      - name: Build static app
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Version Market Atlas assets
        run: |
          node -e 'const fs=require("fs");const p="out/market-atlas/index.html";let html=fs.readFileSync(p,"utf8");html=html.replaceAll("20260822-2",process.env.GITHUB_SHA);fs.writeFileSync(p,html)'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
