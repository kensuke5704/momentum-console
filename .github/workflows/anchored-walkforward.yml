name: Anchored walk-forward research

on:
  push:
    branches: [research/anchored-walkforward-20260830]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/anchored-walkforward-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/anchored-walkforward.ts
      - uses: actions/upload-artifact@v4
        with:
          name: anchored-walkforward-result
          path: data/research/anchored-walkforward/result.json
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/anchored-walkforward/result.json
          git commit -m "research: persist anchored walk-forward result [skip ci]" || exit 0
          git push origin HEAD:research/anchored-walkforward-20260830
