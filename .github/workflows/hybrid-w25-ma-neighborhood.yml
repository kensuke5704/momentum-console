name: Hybrid W25 MA neighborhood
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths: [scripts/hybrid-w25-ma-neighborhood.ts, .github/workflows/hybrid-w25-ma-neighborhood.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/hybrid-w25-ma-neighborhood.ts
      - uses: actions/upload-artifact@v4
        with: {name: hybrid-w25-ma-neighborhood-result, path: data/research/hybrid-w25-ma-neighborhood/result.json}