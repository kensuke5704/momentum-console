name: Research Gate B Aggregate Structure Diagnostic 2020
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - 'scripts/research-gate-b-aggregate-structure-diagnostic-2020.py'
      - 'scripts/research-gate-b-aggregate-shadow-2020.py'
      - 'data/research/gate-b-production-source-manifest-2020.json'
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-gate-b-aggregate-structure-diagnostic-2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-aggregate-structure-diagnostic-2020
          path: data/research/gate-b-aggregate-structure-diagnostic-2020.json
