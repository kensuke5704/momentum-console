name: Fix backtest performance source

on:
  push:
    branches: [fix/backtest-performance-source-20260829]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backtest stats source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/momentum-app.tsx')
          text = path.read_text()
          old = 'PerformanceView stats={nportDelayMonteCarlo.baseline.stats} equityCurve={data.backtest.equityCurve}'
          new = 'PerformanceView stats={data.backtest.stats} equityCurve={data.backtest.equityCurve}'
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/momentum-app.tsx
          git commit -m "fix: show production backtest performance stats"
          git push
