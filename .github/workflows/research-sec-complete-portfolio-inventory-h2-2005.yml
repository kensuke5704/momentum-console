name: Research SEC Complete Portfolio Inventory H2 2005

on:
  workflow_dispatch:
  push:
    branches:
      - research/nq-npx-mapping-2006-20260903
    paths:
      - scripts/research-sec-complete-portfolio-inventory-h2-2005.py
      - .github/workflows/research-sec-complete-portfolio-inventory-h2-2005.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build H2 2005 complete-portfolio inventory
        run: python scripts/research-sec-complete-portfolio-inventory-h2-2005.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-complete-portfolio-inventory-h2-2005
          path: data/research/sec-complete-portfolio-inventory-h2-2005.json
          if-no-files-found: error
