name: FINRA short interest probe
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/finra-short-interest-probe.ts
      - .github/workflows/finra-short-interest-probe.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx tsx scripts/finra-short-interest-probe.ts
