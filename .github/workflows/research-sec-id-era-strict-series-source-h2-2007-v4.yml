name: Research SEC ID Era Strict Series Source H2 2007 V4

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2007-20260908"]
    paths:
      - "docs/research/h2-2007-source-v4-trigger.md"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed successful H2 2007 strict-source shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34187436415
          pattern: id-era-strict-v3-series-source-h2-2007-shard-*
          path: data/research/id-era-strict-h2-2007-shards
          merge-multiple: true
      - name: Download authoritative H1 source and H1 candidate-review boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h1source /tmp/h1pref
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10040000632/zip > /tmp/h1source.zip
          unzip -q /tmp/h1source.zip -d /tmp/h1source
          cp /tmp/h1source/sec-id-era-strict-series-source-h1-2007.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10039881783/zip > /tmp/h1pref.zip
          unzip -q /tmp/h1pref.zip -d /tmp/h1pref
          cp /tmp/h1pref/sec-etf-registrant-operational-prefilter-through-h1-2007.json data/research/
      - name: Apply documented closed-history candidate-discovery boundary
        run: python3 scripts/research-sec-id-era-strict-series-source-merge-h2-2007-v4.py
      - name: Require original pre-defined H2 2007 source period-extension validation unchanged
        run: python3 scripts/research-sec-id-era-strict-series-source-validation-h2-2007.py
      - name: Compute fixed source catalog SHA256
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA256=$(sha256sum data/research/sec-id-era-strict-series-source-h2-2007.json | awk '{print $1}')"
      - uses: actions/upload-artifact@v4
        with:
          name: sec-id-era-strict-series-source-h2-2007-v4
          path: |
            data/research/sec-id-era-strict-series-source-h2-2007.json
            data/research/sec-id-era-strict-series-source-h2-2007-validation.json
          if-no-files-found: error
