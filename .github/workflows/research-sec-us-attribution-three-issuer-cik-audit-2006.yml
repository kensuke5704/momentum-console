name: Research SEC US Attribution Three Issuer CIK Audit 2006
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - scripts/research-sec-us-attribution-three-issuer-cik-audit-2006.py
      - .github/workflows/research-sec-us-attribution-three-issuer-cik-audit-2006.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-sec-us-attribution-three-issuer-cik-audit-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-us-attribution-three-issuer-cik-audit-2006
          path: data/research/sec-us-attribution-three-issuer-cik-audit-2006.json
          if-no-files-found: warn
