name: Research Momentum v2.9 Authoritative Holdings v3

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - ".github/workflows/research-momentum-v2-9-authoritative-holdings-v3.yml"

permissions:
  contents: read
  actions: read

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34016656323"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for source chain and download source catalog
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}" --jq '.status')
            echo "source status=${status}"
            [ "$status" = "completed" ] && break
            sleep 10
          done
          artifact_id=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="momentum-v2-9-authoritative-h1-2006-v2") | .id' | head -n1)
          [ -n "$artifact_id" ] || { echo "source artifact missing"; exit 1; }
          mkdir -p data/research /tmp/source
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${artifact_id}/zip" > /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/source
          for f in sec-legacy-etf-series-source-preid-v29genuine-2006.json sec-id-era-strict-series-source-h1-2006-v29qualified.json sec-hybrid-etf-source-catalog-h1-2006.json momentum-v2-9-authoritative-source-audit-h1-2006.json; do
            cp "$(find /tmp/source -type f -name "$f" | head -n1)" "data/research/$f"
          done
      - name: Parse holdings with HTML-preserving zero-only fixed-width fallback
        env:
          CATALOG_PATH: data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          SOURCE_CATALOG_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-v29final-v2.py
      - name: Final holdings audit
        run: |
          python3 - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          r=Path('data/research'); raw=json.loads((r/'nq-pit-holdings-hybrid-h1-2006.json').read_text())
          zero={}; no_grouped={}; bad=[]; methods=Counter(); months=[]
          bad_re=re.compile(r'RESPECTIVELY|CAPITAL SHARE TRANSACTIONS|NET INCREASE|BEGINNING OF PERIOD|END OF PERIOD|TAX COST|UNREALIZED',re.I)
          for s in raw['monthSnapshots']:
              status=Counter(x.get('parseStatus') for x in s['sourceFilings']); ce=0; ces=0
              for x in s['sourceFilings']:
                  methods[x.get('parseMethod','NONE')]+=1
                  if x.get('parseStatus')=='PARSED_ZERO_HOLDINGS': zero[x['canonicalIdentity']]=x
                  if x.get('parseStatus')=='NO_GROUPED_SCHEDULE': no_grouped[x['canonicalIdentity']]=x
                  c=sum(h.get('legacyAssetSection')=='COMMON_EQUITY' for h in x.get('holdings',[])); ce+=c; ces+=bool(c)
                  bad.extend({'identity':x['canonicalIdentity'],'description':h.get('description')} for h in x.get('holdings',[]) if bad_re.search(str(h.get('description') or '')))
              months.append({'signalMonth':s['signalMonth'],'sourceSeriesCount':len(s['sourceFilings']),'parseStatusCounts':dict(status),'commonEquityHoldingCount':ce,'commonEquitySourceCount':ces})
          ambiguous=sum(1 for f in raw.get('filingAudit',[]) for e in (f.get('legacyAssignmentAudit') or []) if e.get('assignmentRule')=='AMBIGUOUS_EXACT_TARGETS' and e.get('assignedIdentity') is not None)
          audit={'uniqueSourceFilingCount':raw.get('uniqueSourceFilingCount'),'filingFetchSuccessCount':raw.get('filingFetchSuccessCount'),'filingFetchErrorCount':raw.get('filingFetchErrorCount'),'uniqueParsedHoldingCount':raw.get('uniqueParsedHoldingCount'),'assetSectionCounts':raw.get('legacyAssetSectionCounts'),'parseMethodCountsAcrossSnapshots':dict(methods),'uniqueZeroHoldingTargetCount':len(zero),'uniqueNoGroupedTargetCount':len(no_grouped),'ambiguousAssignedMarkerCount':ambiguous,'badFinancialTextHoldingCount':len(bad),'zeroTargets':[{'canonicalIdentity':x.get('canonicalIdentity'),'seriesName':x.get('seriesName'),'registrant':x.get('registrant'),'form':x.get('form')} for x in zero.values()],'noGroupedTargets':[{'canonicalIdentity':x.get('canonicalIdentity'),'seriesName':x.get('seriesName'),'registrant':x.get('registrant'),'form':x.get('form')} for x in no_grouped.values()],'badExamples':bad[:20],'months':months}
          (r/'momentum-v2-9-authoritative-holdings-audit-h1-2006.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('HOLDINGS_AUDIT',json.dumps({k:v for k,v in audit.items() if k not in {'zeroTargets','noGroupedTargets','badExamples','months'}}))
          for m in months: print('MONTH',json.dumps(m))
          for x in audit['zeroTargets']: print('ZERO',json.dumps(x))
          for x in audit['noGroupedTargets']: print('NO_GROUPED',json.dumps(x))
          assert raw.get('filingFetchErrorCount')==0
          assert not no_grouped and not zero and ambiguous==0 and not bad
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-authoritative-holdings-v3
          path: |
            data/research/sec-legacy-etf-series-source-preid-v29genuine-2006.json
            data/research/sec-id-era-strict-series-source-h1-2006-v29qualified.json
            data/research/sec-hybrid-etf-source-catalog-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-h1-2006.json
            data/research/nq-pit-holdings-hybrid-h1-2006.json
            data/research/momentum-v2-9-authoritative-holdings-audit-h1-2006.json
          if-no-files-found: warn
