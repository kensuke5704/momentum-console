name: Research SEC ID Era Strict Series Source H2 2006 V3

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2006-20260908"]
    paths:
      - "scripts/research-sec-id-era-strict-series-source-base-through-h2-2006.py"
      - "scripts/research-sec-id-era-strict-series-source-shard-h2-2006-v3.py"
      - "scripts/research-sec-id-era-strict-series-source-merge-h2-2006.py"
      - ".github/workflows/research-sec-id-era-strict-series-source-h2-2006-v3.yml"

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed cumulative complete-portfolio and recall-preserved prefilter inputs
        run: |
          mkdir -p data/research /tmp/inv /tmp/pref
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10025472099/zip > /tmp/inv.zip
          unzip -q /tmp/inv.zip -d /tmp/inv
          cp /tmp/inv/sec-complete-portfolio-inventory-through-h2-2006.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10038188212/zip > /tmp/pref.zip
          unzip -q /tmp/pref.zip -d /tmp/pref
          cp /tmp/pref/sec-etf-registrant-operational-prefilter-through-h2-2006.json data/research/
      - name: Build strict Series source shard through H2 2006
        run: python3 scripts/research-sec-id-era-strict-series-source-shard-h2-2006-v3.py --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: id-era-strict-v3-series-source-h2-2006-shard-${{ matrix.shard }}
          path: data/research/sec-id-era-strict-series-source-h2-2006-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: id-era-strict-v3-series-source-h2-2006-shard-*
          path: data/research/id-era-strict-h2-shards
          merge-multiple: true
      - run: python3 scripts/research-sec-id-era-strict-series-source-merge-h2-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-id-era-strict-series-source-h2-2006-v3
          path: data/research/sec-id-era-strict-series-source-h2-2006.json
          if-no-files-found: error
