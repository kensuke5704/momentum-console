name: Research Momentum v2.9 Gate B Parallel Final

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - ".github/workflows/research-momentum-v2-9-gate-b-parallel-final.yml"

permissions:
  contents: read
  actions: read

jobs:
  gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HOLDINGS_RUN_ID: "34017195100"
      NPX_ARTIFACT_ID: "9876020712"
      BASE_COUNTRY_ARTIFACT_ID: "9944538015"
      STRUCT_COUNTRY_ARTIFACT_ID: "9944797581"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for final parallel holdings artifact
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            status=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${HOLDINGS_RUN_ID}" --jq '.status')
            conclusion=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${HOLDINGS_RUN_ID}" --jq '.conclusion // ""')
            echo "holdings status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "final holdings failed"; exit 1; }
              break
            fi
            sleep 5
          done
          artifact_id=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${HOLDINGS_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="momentum-v2-9-authoritative-holdings-parallel-final") | .id' | head -n1)
          [ -n "$artifact_id" ] || { echo "holdings artifact missing"; exit 1; }
          mkdir -p data/research /tmp/h
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${artifact_id}/zip" > /tmp/h.zip
          unzip -q /tmp/h.zip -d /tmp/h
          for f in nq-pit-holdings-hybrid-h1-2006.json sec-hybrid-etf-source-catalog-h1-2006.json momentum-v2-9-authoritative-source-audit-h1-2006.json momentum-v2-9-authoritative-holdings-audit-h1-2006.json; do cp "$(find /tmp/h -type f -name "$f" | head -n1)" "data/research/$f"; done
          echo "$artifact_id" > data/research/authoritative-holdings-artifact-id.txt
      - name: Download frozen N-PX and country evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/npx /tmp/base /tmp/struct
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${NPX_ARTIFACT_ID}/zip" > /tmp/npx.zip; unzip -q /tmp/npx.zip -d /tmp/npx
          cp "$(find /tmp/npx -type f -name 'npx-security-master-2006.json' | head -n1)" data/research/npx-security-master-2006.json
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${BASE_COUNTRY_ARTIFACT_ID}/zip" > /tmp/base.zip; unzip -q /tmp/base.zip -d /tmp/base
          cp "$(find /tmp/base -type f -name 'sec-submission-header-country-full-merged-2006.json' | head -n1)" data/research/sec-submission-header-country-full-merged-2006.json
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${STRUCT_COUNTRY_ARTIFACT_ID}/zip" > /tmp/struct.zip; unzip -q /tmp/struct.zip -d /tmp/struct
          cp "$(find /tmp/struct -type f -name 'structural-new-matches-submission-header-country-2006.json' | head -n1)" data/research/structural-new-matches-submission-header-country-2006.json
      - name: COMMON_EQUITY and frozen N-PX mapping
        run: python3 scripts/research-nq-hybrid-structural-mapping-h1-2006.py
      - name: Conservative historical country cache
        run: python3 scripts/research-nq-hybrid-country-cache-h1-2006.py
      - name: Resolve mapped UNKNOWN with PIT SEC evidence
        run: python3 scripts/research-nq-hybrid-country-resolve-h1-2006.py
      - name: Primary Production-order Universe
        run: python3 scripts/research-nq-hybrid-universe-h1-2006.py
      - name: Country upper-bound sensitivity only
        run: python3 scripts/research-nq-hybrid-country-upper-bound-v29.py
      - name: Final Gate B structural decision
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('data/research')
          sa=json.loads((r/'momentum-v2-9-authoritative-source-audit-h1-2006.json').read_text()); pa=json.loads((r/'momentum-v2-9-authoritative-holdings-audit-h1-2006.json').read_text()); mp=json.loads((r/'nq-hybrid-structural-mapping-h1-2006.json').read_text()); co=json.loads((r/'nq-hybrid-country-resolved-h1-2006.json').read_text()); pr=json.loads((r/'nq-hybrid-universe-h1-2006.json').read_text()); up=json.loads((r/'nq-hybrid-universe-country-upper-bound-h1-2006.json').read_text()); cat=json.loads((r/'sec-hybrid-etf-source-catalog-h1-2006.json').read_text()); aid=int((r/'authoritative-holdings-artifact-id.txt').read_text())
          def cmp(a,b):
              ar={x['symbol']:x['universeRank'] for x in a}; br={x['symbol']:x['universeRank'] for x in b}; common=set(ar)&set(br); k=min(len(a),len(b),80); ov=len(common)/k if k else 1.0
              if len(common)>=2:
                  n=len(common); d2=sum((ar[s]-br[s])**2 for s in common); rho=1-(6*d2)/(n*(n*n-1))
              else: rho=1.0 if len(common)==len(ar)==len(br) else None
              top=[x['symbol'] for x in a[:2]]; ret=sum(s in br for s in top)/len(top) if top else 1.0
              return {'overlap':ov,'spearman':rho,'top2Retention':ret,'commonCount':len(common),'k':k,'primaryTop2':top}
          mm={x['signalMonth']:x for x in mp['monthSnapshots']}; cm={x['signalMonth']:x for x in co['monthSnapshots']}; pm={x['signalMonth']:x for x in pr['monthSnapshots']}; um={x['signalMonth']:x for x in up['monthSnapshots']}; months=[]
          for month in sorted(pm):
              m=mm[month]; c=cm[month]; p=pm[month]; u=um[month]; mt=mk=0; mw=kw=0.0
              for f in c['sourceFilings']:
                  for h in f.get('holdings',[]):
                      if h.get('mappingStatus')!='MATCHED_UNIQUE': continue
                      mt+=1; w=float(h.get('weight') or 0); mw+=w
                      if h.get('countryClassification') in {'US','NON_US'}: mk+=1; kw+=w
              months.append({'signalMonth':month,'commonEquityHoldingCount':m['commonEquityHoldingCount'],'uniqueMappedCount':m['uniqueMappedCount'],'uniqueMappedCountRate':m['uniqueMappedCountRate'],'uniqueMappedWeightRate':m['uniqueMappedWeightRate'],'ambiguousCount':m['ambiguousCount'],'ambiguousWeight':m['ambiguousWeight'],'unmappedCount':m['unmappedCount'],'unmappedWeight':m['unmappedWeight'],'mappedCountryKnownCountRate':mk/mt if mt else None,'mappedCountryKnownWeightRate':kw/mw if mw else None,'eligibleSourceSeriesCount':p['eligibleSourceSeriesCount'],'primaryUniverseSize':len(p['symbols']),'upperUniverseSize':len(u['symbols']),'upperComparison':cmp(p['symbols'],u['symbols'])})
          conflicts=[]
          if any(sa.get(k) for k in ('umbrellaCount','internationalGrowthCount','vanguardAliasGroupCount','ambiguousBridgeCount')): conflicts.append('SOURCE_IDENTITY_OR_BRIDGE')
          if any(pa.get(k) for k in ('filingFetchErrorCount','uniqueZeroHoldingTargetCount','uniqueNoGroupedTargetCount','ambiguousAssignedMarkerCount','badFinancialTextHoldingCount')): conflicts.append('PARSER_STRUCTURAL_ERROR')
          if any(x['ambiguousCount'] for x in months): conflicts.append('AMBIGUOUS_NPX_MAPPING')
          if any(x['eligibleSourceSeriesCount']==0 or x['primaryUniverseSize']==0 for x in months): conflicts.append('EMPTY_SOURCE_OR_UNIVERSE')
          stable=all(x['upperComparison']['overlap']>=0.70 and (x['upperComparison']['spearman'] is None or x['upperComparison']['spearman']>=0.75) and x['upperComparison']['top2Retention']>=0.80 for x in months)
          if not stable: conflicts.append('COUNTRY_UPPER_BOUND_MATERIAL')
          out={'purpose':'Final return-independent Gate B decision for Momentum v2.9 H1 2006 historical Universe source bridge.','authoritativeHoldingsArtifactId':aid,'frozenNpxMasterArtifactId':9876020712,'sourceIdentity':sa,'parsing':{k:pa.get(k) for k in ('sourceArtifactId','uniqueSourceFilingCount','filingFetchSuccessCount','filingFetchErrorCount','uniqueParsedHoldingCount','assetSectionCounts','parseMethodCountsAcrossSnapshots','uniqueZeroHoldingTargetCount','uniqueNoGroupedTargetCount','ambiguousAssignedMarkerCount','badFinancialTextHoldingCount')},'mappingMethodCounts':mp.get('matchMethodCounts'),'country':{k:co.get(k) for k in ('unresolvedInputCount','resolvedUSCount','resolvedNonUSCount','remainingUnknownCount')},'months':months,'countryUpperBoundSensitivityStable':stable,'structuralConflicts':conflicts,'gateBPass':not conflicts,'universeReconstructionConfirmed':not conflicts,'stage21PerformanceConsulted':False,'productionModified':False}
          (r/'momentum-v2-9-final-gate-b-h1-2006.json').write_text(json.dumps(out,indent=2)+'\n'); print('GATE_B',json.dumps({k:v for k,v in out.items() if k!='months'})); [print('MONTH',json.dumps(x)) for x in months]
          if conflicts: raise SystemExit('Gate B blockers: '+','.join(conflicts))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-gate-b-parallel-final
          path: |
            data/research/momentum-v2-9-final-gate-b-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-h1-2006.json
            data/research/momentum-v2-9-authoritative-holdings-audit-h1-2006.json
            data/research/nq-hybrid-structural-mapping-h1-2006.json
            data/research/nq-hybrid-country-resolved-h1-2006.json
            data/research/nq-hybrid-universe-h1-2006.json
            data/research/nq-hybrid-universe-country-upper-bound-h1-2006.json
          if-no-files-found: warn
