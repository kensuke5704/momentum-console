name: Research SEC Filing Index Country Smoke 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-filing-index-country-smoke-2006.py"
      - ".github/workflows/research-sec-filing-index-country-smoke-2006.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download merged country artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/src
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9902743513/zip > /tmp/src.zip
          unzip -q /tmp/src.zip -d /tmp/src
          cp /tmp/src/country-full-coverage-unknown-retry-2006.json data/research/
      - run: python3 scripts/research-sec-filing-index-country-smoke-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-filing-index-country-smoke-2006
          path: data/research/sec-filing-index-country-smoke-2006.json
