name: Research NQ Index Extract

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-nq-index-extract.py"
      - ".github/workflows/research-nq-index-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract 2006 N-Q/N-CSR filing index
        run: python3 scripts/research-nq-index-extract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-index-2006
          path: data/research/nq-index-2006.json
          if-no-files-found: warn
