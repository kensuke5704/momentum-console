name: Research SEC Historical ETF Series Source Catalog H1 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-etf-prefilter-merge-h1-2006.py"
      - "scripts/research-sec-historical-etf-series-source-catalog-h1-2006.py"
      - "scripts/research-sec-historical-etf-issuer-own-evidence-pilot-2006.py"
      - "scripts/research-sec-marketwide-series-class-shard-q1-2006.py"
      - ".github/workflows/research-sec-historical-etf-series-source-catalog-h1-2006.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: research-sec-historical-etf-series-source-catalog-h1-2006-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed H1 N-Q inventory
        run: |
          mkdir -p data/research /tmp/h1-inventory
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9946255797/zip > /tmp/h1-inventory.zip
          unzip -q /tmp/h1-inventory.zip -d /tmp/h1-inventory
          cp /tmp/h1-inventory/sec-marketwide-nq-inventory-h1-2006.json data/research/
      - name: Download completed H1 prefilter shards
        run: |
          mkdir -p data/research /tmp/prefilter
          for id in 9946655199 9946564013 9946627605 9946556132 9946652669 9946629047 9946599883 9946573198 9946600158 9946621704 9946657775 9946650848; do
            gh api /repos/kensuke5704/momentum-console/actions/artifacts/${id}/zip > /tmp/prefilter-${id}.zip
            unzip -q -o /tmp/prefilter-${id}.zip -d data/research
          done
      - name: Merge fixed H1 prefilter shards
        run: python3 scripts/research-sec-etf-prefilter-merge-h1-2006.py
      - name: Build strict Series-ID PIT source catalog
        run: python3 scripts/research-sec-historical-etf-series-source-catalog-h1-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-historical-etf-series-source-catalog-h1-2006
          path: |
            data/research/sec-etf-registrant-operational-prefilter-h1-2006.json
            data/research/sec-historical-etf-series-source-catalog-h1-2006.json
