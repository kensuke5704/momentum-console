name: Forward40 exact partial rebalance
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-exact-partial-rebalance.yml
      - scripts/forward40-exact-partial-rebalance-fixed60.ts
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/forward40-exact-partial-rebalance-fixed60.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-exact-partial-rebalance
          path: data/research/forward40-exact-partial-rebalance-fixed60/result.json
