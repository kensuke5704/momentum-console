name: Top1 75 robustness
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/top1-75-robustness.ts
      - .github/workflows/top1-75-robustness.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/top1-75-robustness.ts
      - uses: actions/upload-artifact@v4
        with:
          name: top1-75-robustness-result
          path: data/research/top1-75-robustness/result.json
