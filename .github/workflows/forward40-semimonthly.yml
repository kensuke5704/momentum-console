name: Forward40 semimonthly refresh
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-semimonthly.yml
      - scripts/fixed60-semimonthly-refresh.ts
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-semimonthly-refresh.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-semimonthly-refresh
          path: data/research/fixed60-semimonthly-refresh/result.json
