name: Hybrid SEC fundamental momentum screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-sec-fundamental-momentum.ts'
      - '.github/workflows/hybrid-sec-fundamental-momentum.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-sec-fundamental-momentum.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-sec-fundamental-momentum-result
          path: data/research/hybrid-sec-fundamental-momentum/result.json
          # rerun 2026-08-30
