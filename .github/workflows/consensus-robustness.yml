name: Consensus robustness
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/consensus-robustness.ts
      - .github/workflows/consensus-robustness.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/consensus-robustness.ts
      - uses: actions/upload-artifact@v4
        with:
          name: consensus-robustness-result
          path: data/research/consensus-robustness/result.json
