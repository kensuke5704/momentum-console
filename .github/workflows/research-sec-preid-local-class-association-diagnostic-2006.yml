name: Research SEC Pre-ID Local Class Association Diagnostic 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-preid-local-class-association-diagnostic-2006.py"
      - ".github/workflows/research-sec-preid-local-class-association-diagnostic-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download structurally tightened pre-ID catalog
        run: |
          mkdir -p data/research /tmp/preid
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9971996574/zip > /tmp/preid.zip
          unzip -q /tmp/preid.zip -d /tmp/preid
          cp /tmp/preid/sec-legacy-etf-series-source-preid-2006.json data/research/
      - name: Diagnose title/class association
        run: python3 scripts/research-sec-preid-local-class-association-diagnostic-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-preid-local-class-association-diagnostic-2006
          path: data/research/sec-preid-local-class-association-diagnostic-2006.json
          if-no-files-found: error
