name: Research CPCM Generator Sensitivity

on:
  workflow_dispatch:
  push:
    branches: ["research/cpcm-validity-audit-20260825"]
    paths:
      - "scripts/cpcm-generator-sensitivity.ts"
      - ".github/workflows/research-cpcm-generator-sensitivity.yml"

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CPCM_SENS_PATHS: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run generator sensitivity
        run: node --import tsx scripts/cpcm-generator-sensitivity.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cpcm-generator-sensitivity
          path: data/research/cpcm-validity/generator-sensitivity.json
          retention-days: 30
