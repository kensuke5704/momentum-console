name: Research SEC ETF Prefilter Merge Through H2 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2006-20260908"]
    paths:
      - "scripts/research-sec-etf-prefilter-merge-through-h2-2006.py"
      - ".github/workflows/research-sec-etf-prefilter-merge-through-h2-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed H2 prefilter shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34140039496
          pattern: sec-etf-registrant-operational-prefilter-through-h2-2006-shard-*
          path: data/research
          merge-multiple: true
      - name: Merge deterministic H2 prefilter shards
        run: python3 scripts/research-sec-etf-prefilter-merge-through-h2-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-etf-registrant-operational-prefilter-through-h2-2006
          path: data/research/sec-etf-registrant-operational-prefilter-through-h2-2006.json
          if-no-files-found: error
