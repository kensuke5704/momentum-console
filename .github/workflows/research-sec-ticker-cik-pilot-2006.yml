name: Research SEC Ticker CIK Pilot 2006

on:
  push:
    paths:
      - 'scripts/research-sec-ticker-cik-pilot-2006.py'
      - '.github/workflows/research-sec-ticker-cik-pilot-2006.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run SEC ticker-to-CIK pilot
        run: python3 scripts/research-sec-ticker-cik-pilot-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-ticker-cik-pilot-2006
          path: data/research/sec-ticker-cik-pilot-2006.json
