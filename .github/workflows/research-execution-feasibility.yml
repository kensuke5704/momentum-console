name: Research Execution Feasibility
on:
  push:
    branches: ["research/execution-feasibility-audit-20260826"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx scripts/execution-feasibility-audit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: execution-feasibility-audit
          path: data/research/execution-feasibility/result.json
          retention-days: 30
