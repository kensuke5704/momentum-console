name: Research Production Jan2020 Legacy Extract
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-production-jan2020-legacy-extract.py"
      - ".github/workflows/research-production-jan2020-legacy-extract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-production-jan2020-legacy-extract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-jan2020-legacy-extract
          path: data/research/production-jan2020-legacy-extract.json
          if-no-files-found: warn
