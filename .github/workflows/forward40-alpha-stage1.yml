name: Forward40 alpha stage1
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-alpha-stage1.yml
      - scripts/riskoff-macro-final-gate.ts
      - scripts/forward40-riskoff-equity-fixed60.ts
      - scripts/forward40-riskoff-gold-fixed60.ts
      - scripts/forward40-riskoff-gold-filtered.ts
      - scripts/vix-term-structure-diagnostic.ts
  workflow_dispatch:
jobs:
  macro-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/riskoff-macro-robustness.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-macro-robustness
          path: data/research/riskoff-macro-robustness/result.json

  macro-final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/riskoff-macro-final-gate.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-macro-final-gate
          path: data/research/riskoff-macro-final-gate/result.json

  riskoff-gold-fixed60:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/forward40-riskoff-gold-fixed60.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-riskoff-gold-fixed60
          path: data/research/forward40-riskoff-gold-fixed60/result.json

  riskoff-gold-filtered:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/forward40-riskoff-gold-filtered.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-riskoff-gold-filtered
          path: data/research/forward40-riskoff-gold-filtered/result.json

  vix-term-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/vix-term-structure-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-vix-term-structure
          path: data/research/vix-term-structure-diagnostic/result.json
