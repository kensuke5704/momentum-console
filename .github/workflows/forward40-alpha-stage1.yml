name: Forward40 alpha stage1
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-alpha-stage1.yml
      - scripts/forward40-riskoff-equity-fixed60.ts
  workflow_dispatch:
jobs:
  fixed60-riskoff-equity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/forward40-riskoff-equity-fixed60.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-fixed60-riskoff-equity
          path: data/research/forward40-riskoff-equity-fixed60/result.json
  macro-rotation-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/riskoff-macro-rotation.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-macro-rotation-screen
          path: data/research/riskoff-macro-rotation/result.json
