name: Research NQ PIT Holdings 2006 Corrected

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-nq-pit-holdings-2006-corrected.py"
      - "scripts/research-nq-series-segmentation-2006.py"
      - ".github/workflows/research-nq-pit-holdings-2006-corrected.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild corrected fixed-source PIT holdings
        run: python3 scripts/research-nq-pit-holdings-2006-corrected.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-pit-holdings-2006-corrected
          path: data/research/nq-pit-holdings-2006-corrected.json
          if-no-files-found: warn
