name: Temporary OAIW ANTW Watchlist Registration
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  register:
    if: github.head_ref == 'chatgpt/add-oaiw-antw-watchlist-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update watchlist and remove temporary files
        run: |
          node --import tsx scripts/chatgpt-register-oaiw-antw-watchlist.ts
          rm scripts/chatgpt-register-oaiw-antw-watchlist.ts
          rm .github/workflows/chatgpt-register-oaiw-antw-watchlist.yml
      - name: Validate watchlist
        run: npm run check:watchlist
      - name: Commit watchlist-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe-watchlist.json scripts/chatgpt-register-oaiw-antw-watchlist.ts .github/workflows/chatgpt-register-oaiw-antw-watchlist.yml
          git commit -m "Add OAIW ANTW constituents to watchlist"
          git push origin HEAD:${{ github.head_ref }}
