name: Dual-horizon consensus allocation
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths: [scripts/dual-horizon-consensus-allocation.ts, .github/workflows/dual-horizon-consensus-allocation.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/dual-horizon-consensus-allocation.ts
      - uses: actions/upload-artifact@v4
        with: {name: dual-horizon-consensus-allocation-result, path: data/research/dual-horizon-consensus-allocation/result.json}