name: Research Independent Alpha Engine 2

on:
  push:
    branches: ["research/independent-alpha-engine2-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha-engine2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare Fixed60 G U portfolios
        run: node --import tsx scripts/fixed60-g-u-portfolio-comparison.ts
