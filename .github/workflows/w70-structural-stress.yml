name: W70 structural stress
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/w70-structural-stress.ts
      - .github/workflows/w70-structural-stress.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/w70-structural-stress.ts
      - uses: actions/upload-artifact@v4
        with:
          name: w70-structural-stress-result
          path: data/research/w70-structural-stress/result.json
