name: Research SEC Legacy ETF Series Source Q4 2005
on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-legacy-etf-series-source-q4-2005.py"
      - ".github/workflows/research-sec-legacy-etf-series-source-q4-2005.yml"
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed Q4 lookback and operational-prefilter inputs
        run: |
          mkdir -p data/research /tmp/inputs
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9962972058/zip > /tmp/inputs.zip
          unzip -q /tmp/inputs.zip -d /tmp/inputs
          cp /tmp/inputs/sec-marketwide-nq-lookback-q4-2005.json data/research/
          cp /tmp/inputs/sec-etf-registrant-operational-prefilter-h1-2006.json data/research/
      - name: Resolve strict pre-Series-ID ETF source identities
        run: python3 scripts/research-sec-legacy-etf-series-source-q4-2005.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-legacy-etf-series-source-q4-2005
          path: data/research/sec-legacy-etf-series-source-q4-2005.json
