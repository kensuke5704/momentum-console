name: Research Legacy Universe Score

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-legacy-universe-score.py"
      - ".github/workflows/research-legacy-universe-score.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify point-in-time legacy universe scoring
        run: python3 scripts/research-legacy-universe-score.py --self-test
