name: Forward40 exact no-churn
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-exact-nochurn.yml
      - scripts/fixed60-exact-no-churn-tax.ts
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-exact-no-churn-tax.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-exact-nochurn
          path: data/research/fixed60-exact-no-churn-tax/result.json
