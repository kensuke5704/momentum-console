name: Hybrid momentum weight transfer
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-momentum-weight-transfer.ts'
      - '.github/workflows/hybrid-momentum-weight-transfer.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-momentum-weight-transfer.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-momentum-weight-transfer-result
          path: data/research/hybrid-momentum-weight-transfer/result.json