name: Research NPORT Registrant CIK Probe 2020
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - scripts/research-nport-registrant-cik-probe-2020.py
      - .github/workflows/research-nport-registrant-cik-probe-2020.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-nport-registrant-cik-probe-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nport-registrant-cik-probe-2020
          path: data/research/nport-registrant-cik-probe-2020.json
          if-no-files-found: warn
