name: Research SEC Legacy ETF Series Source H2 2005

on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-legacy-etf-series-source-h2-2005.py"
      - ".github/workflows/research-sec-legacy-etf-series-source-h2-2005.yml"

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed H2 inventory and operational-prefilter inputs
        run: |
          mkdir -p data/research /tmp/h2 /tmp/pref
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9963689740/zip > /tmp/h2.zip
          unzip -q /tmp/h2.zip -d /tmp/h2
          cp /tmp/h2/sec-complete-portfolio-inventory-h2-2005.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9962972058/zip > /tmp/pref.zip
          unzip -q /tmp/pref.zip -d /tmp/pref
          cp /tmp/pref/sec-etf-registrant-operational-prefilter-h1-2006.json data/research/
      - name: Resolve strict pre-Series-ID ETF sources
        run: python3 scripts/research-sec-legacy-etf-series-source-h2-2005.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-legacy-etf-series-source-h2-2005
          path: data/research/sec-legacy-etf-series-source-h2-2005.json
          if-no-files-found: error
