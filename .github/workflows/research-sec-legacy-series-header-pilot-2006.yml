name: Research SEC Legacy Series Header Pilot 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-legacy-series-header-pilot-2006.py"
      - ".github/workflows/research-sec-legacy-series-header-pilot-2006.yml"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-sec-legacy-series-header-pilot-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-legacy-series-header-pilot-2006
          path: data/research/sec-legacy-series-header-pilot-2006.json
          if-no-files-found: warn
