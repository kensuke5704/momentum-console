name: Research NQ Series Metadata 2006

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-nq-series-metadata-2006.py"
      - "scripts/research-npx-security-master-2006.py"
      - ".github/workflows/research-nq-series-metadata-2006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract 2006 filing index
        run: python3 scripts/research-nq-index-extract.py
      - name: Probe N-Q series and ticker metadata
        run: python3 scripts/research-nq-series-metadata-2006.py
      - name: Probe N-PX issuer ticker security-id mapping
        run: python3 scripts/research-npx-security-master-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-fund-metadata-2006
          path: |
            data/research/nq-series-metadata-2006.json
            data/research/npx-security-master-pilot-2006.json
          if-no-files-found: warn
