name: Research SEC US Attribution Current Ticker Sample 2006

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-us-attribution-current-ticker-sample-2006.py"
      - ".github/workflows/research-sec-us-attribution-current-ticker-sample-2006.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download EC-filtered mapping artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/map
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9878201336/zip > /tmp/map.zip
          unzip -q /tmp/map.zip -d /tmp/map
          cp /tmp/map/nq-npx-mapping-2006.json data/research/
      - name: Run current-ticker seeded PIT country attribution sample
        run: python3 scripts/research-sec-us-attribution-current-ticker-sample-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-us-attribution-current-ticker-sample-2006
          path: data/research/sec-us-attribution-current-ticker-sample-2006.json
          if-no-files-found: warn
