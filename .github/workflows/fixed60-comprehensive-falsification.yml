name: Fixed60 comprehensive falsification

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - scripts/fixed60-comprehensive-falsification.ts
      - .github/workflows/fixed60-comprehensive-falsification.yml
  workflow_dispatch:

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-comprehensive-falsification.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-comprehensive-falsification-result
          path: data/research/fixed60-comprehensive-falsification/result.json
