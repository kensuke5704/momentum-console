name: Research SEC Zero Marker Heading Diagnostic H2 2005

on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-zero-marker-heading-diagnostic-h2-2005.py"
      - ".github/workflows/research-sec-zero-marker-heading-diagnostic-h2-2005.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose zero-marker complete-portfolio headings
        run: python3 scripts/research-sec-zero-marker-heading-diagnostic-h2-2005.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-zero-marker-heading-diagnostic-h2-2005
          path: data/research/sec-zero-marker-heading-diagnostic-h2-2005.json
          if-no-files-found: error
