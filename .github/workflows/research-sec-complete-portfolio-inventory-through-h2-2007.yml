name: Research SEC Complete Portfolio Inventory Through H2 2007

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2007-20260908"]
    paths:
      - "scripts/research-sec-complete-portfolio-inventory-through-h2-2007.py"
      - ".github/workflows/research-sec-complete-portfolio-inventory-through-h2-2007.yml"

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build cumulative complete-portfolio inventory through H2 2007
        run: python3 scripts/research-sec-complete-portfolio-inventory-through-h2-2007.py
      - name: Download authoritative through-H1-2007 complete-portfolio inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h1
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10039815625/zip > /tmp/h1.zip
          unzip -q /tmp/h1.zip -d /tmp/h1
      - name: Require exact H1 2007 cumulative row replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          old=json.load(open('/tmp/h1/sec-complete-portfolio-inventory-through-h1-2007.json'))
          new=json.load(open('data/research/sec-complete-portfolio-inventory-through-h2-2007.json'))
          replay=[r for r in new['rows'] if r['dateFiled']<='2007-06-29']
          assert replay==old['rows'], (len(replay),len(old['rows']))
          assert len(replay)==old['filingCount']
          assert len({r['cik'] for r in replay})==old['uniqueRegistrantCikCount']
          print('EXACT_H1_2007_REPLAY',json.dumps({'rows':len(replay),'registrants':len({r['cik'] for r in replay})}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-complete-portfolio-inventory-through-h2-2007
          path: data/research/sec-complete-portfolio-inventory-through-h2-2007.json
          if-no-files-found: error
