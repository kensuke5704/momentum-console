name: Research Legacy Filing Index Format Diagnostic 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-legacy-filing-index-format-diagnostic-2006.py"
      - ".github/workflows/research-legacy-filing-index-format-diagnostic-2006.yml"
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-legacy-filing-index-format-diagnostic-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-filing-index-format-diagnostic-2006
          path: data/research/legacy-filing-index-format-diagnostic-2006.json
