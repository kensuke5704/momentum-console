name: Research NPORT Filter Sensitivity 2020
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - scripts/research-nport-filter-sensitivity-2020.py
      - .github/workflows/research-nport-filter-sensitivity-2020.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download SEC N-PORT raw quarters
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -A 'momentum-console research kensuke5704@users.noreply.github.com' -o /tmp/2019q4_nport.zip https://www.sec.gov/files/dera/data/form-n-port-data-sets/2019q4_nport.zip
          curl -L --fail --retry 3 --retry-delay 2 -A 'momentum-console research kensuke5704@users.noreply.github.com' -o /tmp/2020q1_nport.zip https://www.sec.gov/files/dera/data/form-n-port-data-sets/2020q1_nport.zip
      - run: python3 scripts/research-nport-filter-sensitivity-2020.py /tmp/2019q4_nport.zip /tmp/2020q1_nport.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nport-filter-sensitivity-2020
          path: data/research/nport-filter-sensitivity-2020.json
          if-no-files-found: warn
