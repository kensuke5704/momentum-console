name: Structural stress research

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - 'scripts/structural-stress.ts'
      - '.github/workflows/structural-stress.yml'
      - 'src/lib/**'
      - 'public/data/market-data.json'
      - 'data/universe-history.json'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/structural-stress.ts
      - uses: actions/upload-artifact@v4
        with:
          name: structural-stress-result
          path: data/research/structural-stress/result.json
