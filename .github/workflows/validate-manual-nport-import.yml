name: Validate Manual N-PORT Import
on:
  push:
    branches: ["research/live-nport-ingestion-20260826"]
    paths:
      - "scripts/import-nport-zip.ts"
      - "package.json"
      - "docs/runbooks/manual-nport-update.md"
      - ".github/workflows/validate-manual-nport-import.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
