name: Research ETFMG Zero Series Diagnostic 2019

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-etfmg-zero-series-diagnostic-2019.py"
      - ".github/workflows/research-etfmg-zero-series-diagnostic-2019.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose fixed zero-row short-gap ETFMG series
        run: python3 scripts/research-etfmg-zero-series-diagnostic-2019.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etfmg-zero-series-diagnostic-2019
          path: data/research/etfmg-zero-series-diagnostic-2019.json
          if-no-files-found: warn
