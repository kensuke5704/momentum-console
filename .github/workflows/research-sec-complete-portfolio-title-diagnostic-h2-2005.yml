name: Research SEC Complete Portfolio Title Diagnostic H2 2005

on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-complete-portfolio-title-diagnostic-h2-2005.py"
      - ".github/workflows/research-sec-complete-portfolio-title-diagnostic-h2-2005.yml"

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed inventory and operational-prefilter inputs
        run: |
          mkdir -p data/research /tmp/inv /tmp/pref
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9963689740/zip > /tmp/inv.zip
          unzip -q /tmp/inv.zip -d /tmp/inv
          cp /tmp/inv/sec-complete-portfolio-inventory-h2-2005.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9962972058/zip > /tmp/pref.zip
          unzip -q /tmp/pref.zip -d /tmp/pref
          cp /tmp/pref/sec-etf-registrant-operational-prefilter-h1-2006.json data/research/
      - name: Inspect complete-portfolio filing titles
        run: python3 scripts/research-sec-complete-portfolio-title-diagnostic-h2-2005.py --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-portfolio-title-diagnostic-h2-2005-shard-${{ matrix.shard }}
          path: data/research/sec-complete-portfolio-title-diagnostic-h2-2005-shard-${{ matrix.shard }}.json
          if-no-files-found: error
