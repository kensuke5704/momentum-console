name: Insider cluster diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/insider-cluster-diagnostic.py'
      - '.github/workflows/insider-cluster-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/insider-cluster-diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: insider-cluster-diagnostic-result
          path: data/research/insider-cluster-diagnostic/result.json
