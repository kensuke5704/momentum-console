name: Fixed60 robustness stress

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - scripts/fixed60-robustness-stress.ts
      - .github/workflows/fixed60-robustness-stress.yml
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-robustness-stress.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-robustness-stress-result
          path: data/research/fixed60-robustness-stress/result.json
