name: Research Momentum v2.9 Authoritative Holdings Sharded v6 H1 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - ".github/workflows/research-momentum-v2-9-authoritative-holdings-sharded-v6-h1-2006.yml"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_ARTIFACT_ID: "9986077545"

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Download source v5 catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/src
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/src.zip
          unzip -q /tmp/src.zip -d /tmp/src
          cp "$(find /tmp/src -name 'sec-hybrid-etf-source-catalog-h1-2006.json'|head -n1)" data/research/sec-hybrid-etf-source-catalog-h1-2006.json
      - name: Parse filing shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "4"
          SOURCE_CATALOG_PATH: data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          SOURCE_CATALOG_RUN_ID: "34022850269"
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-v29-shard-v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-v2-9-holdings-v6-shard-${{ matrix.shard }}
          path: data/research/nq-pit-holdings-hybrid-h1-2006-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download source v5 audit and catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/src
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/src.zip
          unzip -q /tmp/src.zip -d /tmp/src
          cp "$(find /tmp/src -name 'sec-hybrid-etf-source-catalog-h1-2006.json'|head -n1)" data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          cp "$(find /tmp/src -name 'momentum-v2-9-authoritative-source-audit-v5-h1-2006.json'|head -n1)" data/research/momentum-v2-9-authoritative-source-audit-v5-h1-2006.json
      - uses: actions/download-artifact@v4
        with:
          pattern: momentum-v2-9-holdings-v6-shard-*
          path: data/research/shards
          merge-multiple: true
      - name: Merge exact filing shards
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-merge-shards-v6.py
      - name: Final structural audit
        run: python3 scripts/research-nq-authoritative-holdings-audit-v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-authoritative-holdings-sharded-v6-h1-2006
          path: |
            data/research/sec-hybrid-etf-source-catalog-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-v5-h1-2006.json
            data/research/nq-pit-holdings-hybrid-h1-2006.json
            data/research/momentum-v2-9-authoritative-holdings-audit-v5-h1-2006.json
          if-no-files-found: warn
