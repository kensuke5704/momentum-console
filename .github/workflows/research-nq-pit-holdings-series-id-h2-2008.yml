name: Research N-Q PIT Holdings Series-ID H2 2008

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2008-20260909"]
    paths:
      - "scripts/research-nq-pit-holdings-series-id-h2-2008.py"
      - ".github/workflows/research-nq-pit-holdings-series-id-h2-2008.yml"

permissions:
  contents: read
  actions: read

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_CATALOG_ARTIFACT_ID: 10131298181
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed validated H2 strict source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34419962359
          name: sec-id-era-strict-series-source-h2-2008-v3
          path: data/research
      - name: Verify fixed source digest
        shell: bash
        run: |
          set -euo pipefail
          # 5606... is the immutable Actions artifact (ZIP) digest.  The
          # download action extracts its JSON payload, whose content digest is
          # deliberately recorded by the frozen wrapper below instead.
          test -s data/research/sec-id-era-strict-series-source-h2-2008.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/research/sec-id-era-strict-series-source-h2-2008.json')
          x=json.loads(p.read_text())
          assert [(r['signalMonth'],r['asOf']) for r in x['monthSnapshots']]==[
              ('2008-07','2008-07-31'),('2008-08','2008-08-29'),('2008-09','2008-09-30'),
              ('2008-10','2008-10-31'),('2008-11','2008-11-28'),('2008-12','2008-12-31')]
          PY
      - name: Compile H2 holdings wrapper
        run: python3 -m py_compile scripts/research-nq-pit-holdings-series-id-h2-2008.py
      - name: Extract H2 holdings using frozen parser
        run: python3 scripts/research-nq-pit-holdings-series-id-h2-2008.py
      - name: Require PIT parser completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/research/sec-id-era-strict-series-source-h2-2008.json').read_text())
          h=json.loads(Path('data/research/nq-pit-holdings-series-id-h2-2008.json').read_text())
          assert h['sourceCatalogArtifactId']==10131298181
          assert h['filingFetchErrorCount']==0
          assert h['filingFetchSuccessCount']==h['uniqueSourceFilingCount']
          expected=[('2008-07','2008-07-31'),('2008-08','2008-08-29'),('2008-09','2008-09-30'),('2008-10','2008-10-31'),('2008-11','2008-11-28'),('2008-12','2008-12-31')]
          assert [(x['signalMonth'],x['asOf']) for x in s['monthSnapshots']]==expected
          assert [(x['signalMonth'],x['asOf']) for x in h['monthSnapshots']]==expected
          assert all(not x['missingParsedSeries'] for x in h['monthSnapshots'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-pit-holdings-series-id-h2-2008
          path: |
            data/research/sec-id-era-strict-series-source-h2-2008.json
            data/research/sec-id-era-strict-series-source-h2-2008-holdings-adapter.json
            data/research/nq-pit-holdings-series-id-h2-2008.json
          if-no-files-found: error
