name: SEC filings schema probe
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/filings-schema-probe.py'
      - '.github/workflows/filings-schema-probe.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb
      - run: python scripts/filings-schema-probe.py
