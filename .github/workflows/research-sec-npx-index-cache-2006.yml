name: Research SEC N-PX Index Cache 2006

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-npx-index-cache-2006.py"
      - ".github/workflows/research-sec-npx-index-cache-2006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build official SEC N-PX filing index cache
        run: python3 scripts/research-sec-npx-index-cache-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-npx-index-2006
          path: data/research/sec-npx-index-2006.json
          if-no-files-found: warn
