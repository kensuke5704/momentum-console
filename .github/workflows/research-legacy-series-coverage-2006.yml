name: Research Legacy Series Coverage 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-legacy-series-coverage-2006.py"
      - ".github/workflows/research-legacy-series-coverage-2006.yml"
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download corrected PIT and filing-index artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/pit /tmp/idx
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9878189715/zip > /tmp/pit.zip
          unzip -q /tmp/pit.zip -d /tmp/pit
          f=$(find /tmp/pit -type f -name '*.json' | head -1)
          test -n "$f"
          cp "$f" data/research/nq-pit-ec-filtered-2006.json
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9925317298/zip > /tmp/idx.zip
          unzip -q /tmp/idx.zip -d /tmp/idx
          cp /tmp/idx/legacy-filing-index-series-pilot-2006.json data/research/
      - run: python3 scripts/research-legacy-series-coverage-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-series-coverage-2006
          path: data/research/legacy-series-coverage-2006.json
# rerun marker: current PIT records schema v2
