name: Validate Ticker Company Modal

on:
  push:
    branches:
      - feature/ticker-company-modal-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Probe company profile endpoint
        run: |
          node --import tsx -e "import('./src/lib/company-profile.ts').then(async ({fetchCompanyProfile}) => { const p = await fetchCompanyProfile('NVDA'); console.log(JSON.stringify(p)); if (!p?.companyName) process.exit(1); })"
