name: Research NQ Schedule Assignment Audit 2006

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-nq-schedule-assignment-audit-2006.py"
      - ".github/workflows/research-nq-schedule-assignment-audit-2006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit schedule assignment
        run: python3 scripts/research-nq-schedule-assignment-audit-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-schedule-assignment-audit-2006
          path: data/research/nq-schedule-assignment-audit-2006.json
          if-no-files-found: warn
