name: Research Momentum v2.9 Country Filing-Index Recovery v30
on:
  push:
    paths:
      - '.github/workflows/research-momentum-v2-9-country-filing-index-recovery-v30.yml'
      - 'scripts/research-country-filing-index-recovery-v30.py'
permissions:
  actions: read
  contents: read
concurrency:
  group: research-momentum-v2-9-country-filing-index-recovery-v29
  cancel-in-progress: true
jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      COUNTRY_ARTIFACT_ID: '9987700449'
      MASTER_ARTIFACT_ID: '9987637728'
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4
      - name: Download final Gate country and frozen 2005-2006 SEC master rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/c /tmp/master
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COUNTRY_ARTIFACT_ID}/zip" >/tmp/c.zip
          unzip -q /tmp/c.zip -d /tmp/c
          cp "$(find /tmp/c -name 'nq-hybrid-country-resolved-h1-2006.json' | head -n1)" data/research/nq-hybrid-country-resolved-h1-2006.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MASTER_ARTIFACT_ID}/zip" >/tmp/master.zip
          unzip -q /tmp/master.zip -d /tmp/master
          cp "$(find /tmp/master -name 'sec-issuer-master-rows-2005-2006.json' | head -n1)" data/research/sec-issuer-master-rows-2005-2006.json
      - name: Recover strict UNKNOWN from temporally-nearest historical filing pages
        run: python3 scripts/research-country-filing-index-recovery-v30.py
      - uses: actions/upload-artifact@v4
        with:
          name: country-filing-index-recovery-v30-${{ matrix.shard }}
          path: data/research/country-filing-index-recovery-v30-shard-${{ matrix.shard }}.json
          if-no-files-found: error
