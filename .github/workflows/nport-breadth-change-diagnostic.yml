name: NPORT breadth change diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/nport-breadth-change-diagnostic.ts
      - .github/workflows/nport-breadth-change-diagnostic.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/nport-breadth-change-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: nport-breadth-change-diagnostic-result
          path: data/research/nport-breadth-change-diagnostic/result.json
