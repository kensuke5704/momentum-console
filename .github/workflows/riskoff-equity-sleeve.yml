name: Risk-off equity sleeve
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths: [scripts/riskoff-equity-sleeve.ts, .github/workflows/riskoff-equity-sleeve.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/riskoff-equity-sleeve.ts
      - uses: actions/upload-artifact@v4
        with: {name: riskoff-equity-sleeve-result, path: data/research/riskoff-equity-sleeve/result.json}