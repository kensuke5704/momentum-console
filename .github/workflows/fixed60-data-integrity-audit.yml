name: Fixed60 data integrity audit

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - scripts/fixed60-data-integrity-audit.ts
      - .github/workflows/fixed60-data-integrity-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-data-integrity-audit.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed60-data-integrity-audit-result
          path: data/research/fixed60-data-integrity-audit/result.json
