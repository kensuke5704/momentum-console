name: Research SEC Series Class Reference 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-sec-series-class-reference-2020.py"
      - ".github/workflows/research-sec-series-class-reference-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-sec-series-class-reference-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-series-class-reference-2020
          path: data/research/sec-series-class-reference-2020.json
          if-no-files-found: warn
