name: Forward40 skip-month screen
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-skipmonth.yml
      - scripts/skip-month-momentum-screen.ts
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/skip-month-momentum-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-skipmonth
          path: data/research/skip-month-momentum-screen/result.json
