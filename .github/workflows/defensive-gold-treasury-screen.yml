name: Defensive gold treasury screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths: [scripts/defensive-gold-treasury-screen.ts, .github/workflows/defensive-gold-treasury-screen.yml]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/defensive-gold-treasury-screen.ts
      - uses: actions/upload-artifact@v4
        with: {name: defensive-gold-treasury-screen-result, path: data/research/defensive-gold-treasury-screen/result.json}