name: Research Legacy Filing Index Series Pilot 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-legacy-filing-index-series-pilot-2006.py"
      - ".github/workflows/research-legacy-filing-index-series-pilot-2006.yml"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-legacy-filing-index-series-pilot-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-filing-index-series-pilot-2006
          path: data/research/legacy-filing-index-series-pilot-2006.json
# rerun marker: exact rendered SEC Series/Class row parser
