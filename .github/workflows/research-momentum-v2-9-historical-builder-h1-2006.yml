name: Research Momentum v2.9 Historical Builder H1 2006
on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths: [".github/workflows/research-momentum-v2-9-historical-builder-h1-2006.yml"]
permissions:
  contents: read
  actions: read
jobs:
  historical-builder-h1-2006:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GATE_RUN_ID: "34026345049"
    steps:
      - uses: actions/checkout@v4
      - name: Require corrected Gate B v12 PASS and download evidence
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 1200); do
            status=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${GATE_RUN_ID}" --jq '.status')
            conclusion=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${GATE_RUN_ID}" --jq '.conclusion // ""')
            echo "gate status=${status} conclusion=${conclusion}"
            [ "$status" = completed ] && break
            sleep 5
          done
          status=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${GATE_RUN_ID}" --jq '.status')
          conclusion=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${GATE_RUN_ID}" --jq '.conclusion // ""')
          [ "$status" = completed ] || { echo "Gate B v12 wait timeout"; exit 1; }
          [ "$conclusion" = success ] || { echo "Gate B v12 is not PASS; historical builder remains blocked"; exit 1; }
          artifact_id=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${GATE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="momentum-v2-9-final-gate-b-v12-indexed-country-h1-2006") | .id' | head -n1)
          [ -n "$artifact_id" ] || { echo "Gate B v12 artifact missing"; exit 1; }
          mkdir -p data/research /tmp/g
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${artifact_id}/zip" >/tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/g
          for f in momentum-v2-9-final-gate-b-v10-h1-2006.json nq-hybrid-country-resolved-h1-2006.json nq-hybrid-universe-h1-2006.json; do
            cp "$(find /tmp/g -name "$f"|head -n1)" "data/research/$f"
          done
          echo "$artifact_id" > data/research/gate-b-v12-artifact-id.txt
      - name: Build research-only Production-compatible H1 2006 history
        run: python3 scripts/research-build-universe-history-h1-2006-v29.py
      - name: Smoke-test schema and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/research/universe-history-h1-2006-v29.json')
          x=json.loads(p.read_text())
          assert x['productionModified'] is False and x['stage21PerformanceExecuted'] is False
          assert len(x['history'])==6
          assert [m['signalMonth'] for m in x['history']]==['2006-01','2006-02','2006-03','2006-04','2006-05','2006-06']
          required={'signalMonth','asOf','symbols','sourceFilings','added','removed'}
          assert all(set(m)==required for m in x['history'])
          assert all(all({'symbol','universeRank','etfCount','aggregateWeight','maxWeight','recencyWeight','universeScore'}==set(s) for s in m['symbols']) for m in x['history'])
          assert all(all({'accession','seriesId','seriesName','filingDate'}==set(s) for s in m['sourceFilings']) for m in x['history'])
          print('HISTORICAL_BUILDER_SMOKE_PASS', [len(m['symbols']) for m in x['history']])
          PY
          git diff --exit-code -- data/universe-history.json public/data/universe-history.json public/data/universe-current.json data/nport-operations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-historical-builder-h1-2006
          path: |
            data/research/universe-history-h1-2006-v29.json
            data/research/gate-b-v12-artifact-id.txt
          if-no-files-found: warn
