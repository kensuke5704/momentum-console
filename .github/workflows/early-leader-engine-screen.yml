name: Early leader engine screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/early-leader-engine-screen.ts
      - .github/workflows/early-leader-engine-screen.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/early-leader-engine-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: early-leader-engine-screen-result
          path: data/research/early-leader-engine-screen/result.json