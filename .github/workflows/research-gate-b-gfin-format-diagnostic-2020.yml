name: Research Gate B GFIN Format Diagnostic 2020
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - 'scripts/research-gate-b-gfin-format-diagnostic-2020.py'
      - '.github/workflows/research-gate-b-gfin-format-diagnostic-2020.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-gate-b-gfin-format-diagnostic-2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: gate-b-gfin-format-diagnostic-2020
          path: data/research/gate-b-gfin-format-diagnostic-2020.json
