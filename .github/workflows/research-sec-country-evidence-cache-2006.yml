name: Research SEC Country Evidence Cache 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-country-evidence-cache-2006.py"
      - ".github/workflows/research-sec-country-evidence-cache-2006.yml"
permissions:
  actions: read
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full shards and prior positive evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/a
          for id in 9899576576 9899613855 9899615372 9899726555 9899657365 9899586966 9899685447 9899596629 9899611719 9899631303 9899573753 9899610056; do
            gh api /repos/kensuke5704/momentum-console/actions/artifacts/$id/zip > /tmp/a/$id.zip
            unzip -qo /tmp/a/$id.zip -d data/research
          done
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9884212384/zip > /tmp/a/sample.zip
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9884892743/zip > /tmp/a/audit.zip
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9899670642/zip > /tmp/a/suffix.zip
          unzip -qo /tmp/a/sample.zip -d data/research
          unzip -qo /tmp/a/audit.zip -d data/research
          unzip -qo /tmp/a/suffix.zip -d data/research
          ls -1 data/research/sec-us-attribution-full-shard-*-2006.json | wc -l
      - run: python3 scripts/research-sec-country-evidence-cache-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-country-evidence-cache-2006
          path: data/research/sec-country-evidence-cache-2006.json
