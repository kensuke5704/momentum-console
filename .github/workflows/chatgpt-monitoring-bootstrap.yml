name: Temporary monitoring bootstrap

on:
  push:
    branches: ["agent/universe-forward-monitoring"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip-monitoring-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universe-forward-monitoring
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:oos
      - run: npm run sync:monitoring
      - run: npm run check
      - name: Commit generated monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/oos-performance.json data/universe-monitoring.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bootstrap universe monitoring [skip-monitoring-bootstrap]"
          git push
