name: Research SEC Filing Index Country Canonical Merge 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-filing-index-country-canonical-merge-2006.py"
      - ".github/workflows/research-sec-filing-index-country-canonical-merge-2006.yml"
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download baseline, mapping, and canonical shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/base /tmp/map /tmp/shards
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9902743513/zip > /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base
          cp /tmp/base/country-full-coverage-unknown-retry-2006.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9878201336/zip > /tmp/map.zip
          unzip -q /tmp/map.zip -d /tmp/map
          cp /tmp/map/nq-npx-mapping-2006.json data/research/
          for id in 9930220515 9930232911 9930222724 9930268280 9930301395 9930223894 9930244105 9930301562 9930314782 9930237951 9930235320 9930229665; do
            gh api /repos/kensuke5704/momentum-console/actions/artifacts/$id/zip > /tmp/a.zip
            unzip -q -o /tmp/a.zip -d /tmp/shards
          done
          cp /tmp/shards/*.json data/research/
      - run: python3 scripts/research-sec-filing-index-country-canonical-merge-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: country-full-coverage-canonical-merge-2006
          path: data/research/country-full-coverage-canonical-merge-2006.json
