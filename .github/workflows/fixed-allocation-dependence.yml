name: Fixed allocation dependence
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/fixed-allocation-dependence.ts
      - .github/workflows/fixed-allocation-dependence.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed-allocation-dependence.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-allocation-dependence-result
          path: data/research/fixed-allocation-dependence/result.json
