name: Rank momentum screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/rank-momentum-screen.ts
      - .github/workflows/rank-momentum-screen.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/rank-momentum-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rank-momentum-screen-result
          path: data/research/rank-momentum-screen/result.json