name: Research Production Jan2020 Ground Truth
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-production-jan2020-groundtruth.py"
      - ".github/workflows/research-production-jan2020-groundtruth.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-production-jan2020-groundtruth.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-jan2020-groundtruth
          path: data/research/production-jan2020-groundtruth.json
