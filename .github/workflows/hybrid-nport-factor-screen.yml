name: Hybrid N-PORT factor screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-nport-factor-screen.ts'
      - '.github/workflows/hybrid-nport-factor-screen.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-nport-factor-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-nport-factor-screen-result
          path: data/research/hybrid-nport-factor-screen/result.json
          # rerun 2026-08-30
