name: Fixed60 forward shadow

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - scripts/fixed60-forward-shadow.ts
      - .github/workflows/fixed60-forward-shadow.yml
  workflow_dispatch:

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild PIT universe through completed signal months
        run: npm run sync:universe
      - name: Refresh market data in ephemeral runner
        run: npm run sync:data
      - name: Evaluate frozen Fixed60 shadow
        run: npx tsx scripts/fixed60-forward-shadow.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-forward-shadow-result
          path: data/research/fixed60-forward-shadow/result.json
