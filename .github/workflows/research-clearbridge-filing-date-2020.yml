name: Research ClearBridge Filing Date 2020
on:
  push:
    branches: [research/nq-npx-mapping-2006-20260903]
    paths:
      - 'scripts/research-clearbridge-filing-date-2020.py'
      - '.github/workflows/research-clearbridge-filing-date-2020.yml'
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-clearbridge-filing-date-2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: clearbridge-filing-date-2020
          path: data/research/clearbridge-filing-date-2020.json
