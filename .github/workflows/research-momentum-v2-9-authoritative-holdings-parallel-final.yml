name: Research Momentum v2.9 Authoritative Holdings Parallel Final

on:
  workflow_dispatch:
  push:
    branches: ["research/momentum-v2-9-preid-fix-20260906"]
    paths:
      - ".github/workflows/research-momentum-v2-9-authoritative-holdings-parallel-final.yml"

permissions:
  contents: read
  actions: read

jobs:
  holdings-final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34017177096"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for authoritative source artifact
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}" --jq '.status')
            conclusion=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion // ""')
            echo "source status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "source final failed"; exit 1; }
              break
            fi
            sleep 5
          done
          artifact_id=$(gh api "/repos/kensuke5704/momentum-console/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="momentum-v2-9-authoritative-source-final-h1-2006") | .id' | head -n1)
          [ -n "$artifact_id" ] || { echo "source artifact missing"; exit 1; }
          mkdir -p data/research /tmp/source
          gh api "/repos/kensuke5704/momentum-console/actions/artifacts/${artifact_id}/zip" > /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/source
          for f in sec-legacy-etf-series-source-preid-v29genuine-2006.json sec-id-era-strict-series-source-h1-2006-v29qualified.json sec-hybrid-etf-source-catalog-h1-2006.json momentum-v2-9-authoritative-source-audit-h1-2006.json; do cp "$(find /tmp/source -type f -name "$f" | head -n1)" "data/research/$f"; done
          echo "$artifact_id" > data/research/source-artifact-id.txt
      - name: Parallel prefetch and HTML-first/fixed-width-zero-only parse
        env:
          CATALOG_PATH: data/research/sec-hybrid-etf-source-catalog-h1-2006.json
          SOURCE_CATALOG_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/research-nq-pit-holdings-hybrid-h1-2006-v29final-parallel.py
      - name: Final holdings structural audit
        run: |
          python3 - <<'PY'
          import json,re
          from collections import Counter
          from pathlib import Path
          r=Path('data/research'); raw=json.loads((r/'nq-pit-holdings-hybrid-h1-2006.json').read_text())
          zero={}; nog={}; bad=[]; methods=Counter(); months=[]; bad_re=re.compile(r'RESPECTIVELY|CAPITAL SHARE TRANSACTIONS|NET INCREASE|BEGINNING OF PERIOD|END OF PERIOD|TAX COST|UNREALIZED',re.I)
          for s in raw['monthSnapshots']:
              st=Counter(x.get('parseStatus') for x in s['sourceFilings']); ce=0; ces=0
              for x in s['sourceFilings']:
                  methods[x.get('parseMethod','NONE')]+=1
                  if x.get('parseStatus')=='PARSED_ZERO_HOLDINGS': zero[x['canonicalIdentity']]=x
                  if x.get('parseStatus')=='NO_GROUPED_SCHEDULE': nog[x['canonicalIdentity']]=x
                  c=sum(h.get('legacyAssetSection')=='COMMON_EQUITY' for h in x.get('holdings',[])); ce+=c; ces+=bool(c)
                  bad.extend({'identity':x['canonicalIdentity'],'description':h.get('description')} for h in x.get('holdings',[]) if bad_re.search(str(h.get('description') or '')))
              months.append({'signalMonth':s['signalMonth'],'sourceSeriesCount':len(s['sourceFilings']),'parseStatusCounts':dict(st),'commonEquityHoldingCount':ce,'commonEquitySourceCount':ces})
          amb=sum(1 for f in raw.get('filingAudit',[]) for e in (f.get('legacyAssignmentAudit') or []) if e.get('assignmentRule')=='AMBIGUOUS_EXACT_TARGETS' and e.get('assignedIdentity') is not None)
          audit={'sourceArtifactId':int((r/'source-artifact-id.txt').read_text()),'uniqueSourceFilingCount':raw.get('uniqueSourceFilingCount'),'filingFetchSuccessCount':raw.get('filingFetchSuccessCount'),'filingFetchErrorCount':raw.get('filingFetchErrorCount'),'uniqueParsedHoldingCount':raw.get('uniqueParsedHoldingCount'),'assetSectionCounts':raw.get('legacyAssetSectionCounts'),'parseMethodCountsAcrossSnapshots':dict(methods),'uniqueZeroHoldingTargetCount':len(zero),'uniqueNoGroupedTargetCount':len(nog),'ambiguousAssignedMarkerCount':amb,'badFinancialTextHoldingCount':len(bad),'zeroTargets':[{'canonicalIdentity':x.get('canonicalIdentity'),'seriesName':x.get('seriesName'),'registrant':x.get('registrant'),'form':x.get('form'),'sourceFilename':x.get('sourceFilename')} for x in zero.values()],'noGroupedTargets':[{'canonicalIdentity':x.get('canonicalIdentity'),'seriesName':x.get('seriesName'),'registrant':x.get('registrant'),'form':x.get('form'),'sourceFilename':x.get('sourceFilename')} for x in nog.values()],'badExamples':bad[:20],'months':months}
          (r/'momentum-v2-9-authoritative-holdings-audit-h1-2006.json').write_text(json.dumps(audit,indent=2)+'\n'); print('HOLDINGS_AUDIT',json.dumps({k:v for k,v in audit.items() if k not in {'zeroTargets','noGroupedTargets','badExamples','months'}}))
          for m in months: print('MONTH',json.dumps(m))
          for x in audit['zeroTargets']: print('ZERO',json.dumps(x))
          for x in audit['noGroupedTargets']: print('NO_GROUPED',json.dumps(x))
          assert raw.get('filingFetchErrorCount')==0
          assert not zero and not nog and amb==0 and not bad
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-v2-9-authoritative-holdings-parallel-final
          path: |
            data/research/sec-hybrid-etf-source-catalog-h1-2006.json
            data/research/momentum-v2-9-authoritative-source-audit-h1-2006.json
            data/research/nq-pit-holdings-hybrid-h1-2006.json
            data/research/momentum-v2-9-authoritative-holdings-audit-h1-2006.json
          if-no-files-found: warn
