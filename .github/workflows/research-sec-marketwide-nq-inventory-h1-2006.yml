name: Research SEC Market-wide N-Q Inventory H1 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-marketwide-nq-inventory-h1-2006.py"
      - ".github/workflows/research-sec-marketwide-nq-inventory-h1-2006.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build official SEC H1 market-wide N-Q inventory
        run: python3 scripts/research-sec-marketwide-nq-inventory-h1-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-marketwide-nq-inventory-h1-2006
          path: data/research/sec-marketwide-nq-inventory-h1-2006.json
