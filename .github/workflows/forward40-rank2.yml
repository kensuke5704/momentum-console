name: Forward40 rank2 screens
on:
  push:
    branches: [research/forward40-alpha-stage1-20260831]
    paths:
      - .github/workflows/forward40-rank2.yml
      - scripts/rank2-quality-screen.ts
      - scripts/rank2-regime-filter.ts
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/rank2-quality-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-rank2-quality
          path: data/research/rank2-quality-screen/result.json
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/rank2-regime-filter.ts
      - uses: actions/upload-artifact@v4
        with:
          name: forward40-rank2-regime
          path: data/research/rank2-regime-filter/result.json
