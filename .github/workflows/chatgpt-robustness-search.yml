name: ChatGPT Robustness Search

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run robustness search
        run: node --import tsx scripts/chatgpt-robustness-search.ts
      - name: Run targeted TopN robustness
        run: node --import tsx scripts/chatgpt-topn-robustness.ts
      - name: Upload robustness search results
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-robustness-search-results
          path: |
            artifacts/robustness-search.json
            artifacts/topn-robustness.json
          if-no-files-found: error
