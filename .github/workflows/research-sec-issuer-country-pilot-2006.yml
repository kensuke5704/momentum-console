name: Research SEC Issuer Country Pilot 2006

on:
  push:
    paths:
      - 'scripts/research-sec-issuer-country-pilot-2006.py'
      - '.github/workflows/research-sec-issuer-country-pilot-2006.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run SEC issuer-country pilot
        run: python3 scripts/research-sec-issuer-country-pilot-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-issuer-country-pilot-2006
          path: data/research/sec-issuer-country-pilot-2006.json
