name: Hybrid65 deep validation
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/hybrid65-deep-validation.ts
      - .github/workflows/hybrid65-deep-validation.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid65-deep-validation.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid65-deep-validation-result
          path: data/research/hybrid65-deep-validation/result.json
