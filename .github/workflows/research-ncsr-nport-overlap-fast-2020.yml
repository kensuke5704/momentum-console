name: Research NCSR NPORT Overlap Fast 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-ncsr-nport-overlap-fast-2020.py"
      - "scripts/research-ncsr-nport-overlap-2020.py"
      - "scripts/research-nq-parser-pilot.py"
      - "scripts/research-nq-pit-holdings-2006.py"
      - "scripts/research-nq-series-segmentation-2006.py"
      - "scripts/research-nq-series-metadata-2006.py"
      - ".github/workflows/research-ncsr-nport-overlap-fast-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-ncsr-nport-overlap-fast-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncsr-nport-overlap-fast-2020
          path: data/research/ncsr-nport-overlap-fast-2020.json
          if-no-files-found: warn
