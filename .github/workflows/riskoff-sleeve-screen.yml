name: Risk-off sleeve screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/riskoff-sleeve-screen.ts
      - .github/workflows/riskoff-sleeve-screen.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/riskoff-sleeve-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: riskoff-sleeve-screen-result
          path: data/research/riskoff-sleeve-screen/result.json