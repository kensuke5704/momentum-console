name: Research Jan2020 Source Registrant Resolve

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-jan2020-source-registrant-resolve.py"
      - ".github/workflows/research-jan2020-source-registrant-resolve.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-jan2020-source-registrant-resolve.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jan2020-source-registrant-resolve
          path: data/research/jan2020-source-registrant-resolve.json
          if-no-files-found: warn
