name: Research BQ NQ Mirror Probe

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - ".github/workflows/research-bq-nq-mirror-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe known historical N-Q mirror documents
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            "https://edgar.businessquant.com/Archives/edgar/data/1551030/000089418918005288/horizons_nq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/1444822/000119312517062613/d354202dnq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/795259/000110465913086761/a13-23900_1nq.htm"
          )
          ok=0
          for u in "${urls[@]}"; do
            code=$(curl -L -sS -o /tmp/nq.html -w '%{http_code}' --max-time 60 "$u" || true)
            bytes=$(wc -c </tmp/nq.html 2>/dev/null || echo 0)
            echo "$code $bytes $u"
            if [ "$code" = "200" ] && [ "$bytes" -gt 10000 ]; then ok=$((ok+1)); fi
          done
          echo "documents_successful=$ok/${#urls[@]}"
          test "$ok" -eq 3
      - name: Inspect free HF EDGAR master-index dataset
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base='https://huggingface.co/api/datasets/arthrod/SEC_filings_1994_2024/tree/main?recursive=true&expand=false'
          req=urllib.request.Request(base,headers={'User-Agent':'momentum-console research'})
          with urllib.request.urlopen(req,timeout=90) as r: rows=json.load(r)
          print('entries',len(rows))
          for x in rows[:100]:
              print(x.get('type'),x.get('path'),x.get('size'))
          files=[x for x in rows if x.get('type')=='file']
          print('files',len(files),'bytes',sum((x.get('size') or 0) for x in files))
          assert files
          PY
