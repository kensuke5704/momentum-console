name: Research BQ NQ Mirror Probe

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - ".github/workflows/research-bq-nq-mirror-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe known historical N-Q mirror documents
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            "https://edgar.businessquant.com/Archives/edgar/data/1551030/000089418918005288/horizons_nq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/1444822/000119312517062613/d354202dnq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/795259/000110465913086761/a13-23900_1nq.htm"
          )
          ok=0
          for u in "${urls[@]}"; do
            code=$(curl -L -sS -o /tmp/nq.html -w '%{http_code}' --max-time 60 "$u" || true)
            bytes=$(wc -c </tmp/nq.html 2>/dev/null || echo 0)
            echo "$code $bytes $u"
            if [ "$code" = "200" ] && [ "$bytes" -gt 10000 ]; then ok=$((ok+1)); fi
          done
          test "$ok" -eq 3
      - name: Verify Notre Dame index and complete submission mirror URL
        shell: bash
        run: |
          set -euo pipefail
          file_id="1yfQxR45DZ_vM5pkFvgyexc10NNqbxpFN"
          curl -L --fail --retry 3 --max-time 180 -o /tmp/master.zip "https://drive.usercontent.google.com/download?id=${file_id}&export=download&confirm=t"
          prefix="MasterIndex_20260318"
          for y in 2004 2006 2008 2010 2013 2016 2018 2019 2020; do
            n=0
            for q in 1 2 3 4; do
              c=$(unzip -p /tmp/master.zip "${prefix}/master_${y}_QTR${q}.idx" 2>/dev/null | grep -Ec '\|N-Q(/A)?\|' || true)
              n=$((n+c))
            done
            echo "YEAR_NQ $y $n"
          done
          # The master index provides the complete-submission filename. Confirm the mirror can serve
          # that exact submission via the canonical EDGAR accession directory for known filings.
          tests=(
            "1551030|0000894189-18-005288.txt"
            "1444822|0001193125-17-062613.txt"
            "795259|0001104659-13-086761.txt"
          )
          ok=0
          for t in "${tests[@]}"; do
            IFS='|' read -r cik fn <<< "$t"
            nodash="${fn%.txt}"; nodash="${nodash//-/}"
            u="https://edgar.businessquant.com/Archives/edgar/data/${cik}/${nodash}/${fn}"
            code=$(curl -L -sS -o /tmp/sub.txt -w '%{http_code}' --max-time 90 "$u" || true)
            bytes=$(wc -c </tmp/sub.txt 2>/dev/null || echo 0)
            form=$(grep -Eic '<TYPE>N-Q|CONFORMED SUBMISSION TYPE:[[:space:]]*N-Q' /tmp/sub.txt 2>/dev/null || true)
            echo "COMPLETE code=$code bytes=$bytes form=$form $u"
            if [ "$code" = "200" ] && [ "$bytes" -gt 10000 ] && [ "$form" -gt 0 ]; then ok=$((ok+1)); fi
          done
          echo "complete_submission_success=$ok/3"
          test "$ok" -eq 3
