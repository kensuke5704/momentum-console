name: Research BQ NQ Mirror Probe

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - ".github/workflows/research-bq-nq-mirror-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe known historical N-Q mirror documents
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            "https://edgar.businessquant.com/Archives/edgar/data/1551030/000089418918005288/horizons_nq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/1444822/000119312517062613/d354202dnq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/795259/000110465913086761/a13-23900_1nq.htm"
          )
          ok=0
          for u in "${urls[@]}"; do
            code=$(curl -L -sS -o /tmp/nq.html -w '%{http_code}' --max-time 60 "$u" || true)
            bytes=$(wc -c </tmp/nq.html 2>/dev/null || echo 0)
            echo "$code $bytes $u"
            if [ "$code" = "200" ] && [ "$bytes" -gt 10000 ]; then ok=$((ok+1)); fi
          done
          echo "documents_successful=$ok/${#urls[@]}"
          test "$ok" -eq 3
      - name: Probe SEC EFTS historical N-Q index
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          params={
            'forms':'N-Q',
            'startdt':'2018-01-01',
            'enddt':'2018-12-31',
            'from':'0',
            'size':'100'
          }
          url='https://efts.sec.gov/LATEST/search-index?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'momentum-console research kensuke5704@users.noreply.github.com','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r:
            print('status',r.status)
            obj=json.load(r)
          hits=obj.get('hits',{}).get('hits',[])
          total=obj.get('hits',{}).get('total')
          print('total',total,'returned',len(hits))
          for h in hits[:5]:
            print(h.get('_id'),h.get('_source',{}).get('ciks'),h.get('_source',{}).get('file_date'),h.get('_source',{}).get('root_forms'))
          assert hits
          PY
