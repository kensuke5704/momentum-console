name: Research BQ NQ Mirror Probe

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - ".github/workflows/research-bq-nq-mirror-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe known historical N-Q mirror documents
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            "https://edgar.businessquant.com/Archives/edgar/data/1551030/000089418918005288/horizons_nq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/1444822/000119312517062613/d354202dnq.htm"
            "https://edgar.businessquant.com/Archives/edgar/data/795259/000110465913086761/a13-23900_1nq.htm"
          )
          ok=0
          for u in "${urls[@]}"; do
            code=$(curl -L -sS -o /tmp/nq.html -w '%{http_code}' --max-time 60 "$u" || true)
            bytes=$(wc -c </tmp/nq.html 2>/dev/null || echo 0)
            echo "$code $bytes $u"
            if [ "$code" = "200" ] && [ "$bytes" -gt 10000 ]; then ok=$((ok+1)); fi
          done
          echo "documents_successful=$ok/${#urls[@]}"
          test "$ok" -eq 3
      - name: Download Notre Dame SEC master-index archive
        shell: bash
        run: |
          set -euo pipefail
          file_id="1yfQxR45DZ_vM5pkFvgyexc10NNqbxpFN"
          url="https://drive.usercontent.google.com/download?id=${file_id}&export=download&confirm=t"
          curl -L --fail --retry 3 --max-time 180 -o /tmp/master.zip "$url"
          ls -lh /tmp/master.zip
          file /tmp/master.zip
          unzip -l /tmp/master.zip | head -20
          for f in master_2004_QTR1.idx master_2008_QTR4.idx master_2013_QTR4.idx master_2019_QTR4.idx; do
            unzip -p /tmp/master.zip "$f" > /tmp/q.idx
            nq=$(grep -c '|N-Q|' /tmp/q.idx || true)
            echo "$f N-Q rows=$nq"
            test "$nq" -gt 0
          done
