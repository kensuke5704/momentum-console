name: SEC filing drift diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/sec-filing-drift-diagnostic.py'
      - '.github/workflows/sec-filing-drift-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sec-filing-drift-diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-filing-drift-diagnostic-result
          path: data/research/sec-filing-drift-diagnostic/result.json
