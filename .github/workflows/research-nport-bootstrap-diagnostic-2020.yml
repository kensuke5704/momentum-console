name: Research NPORT Bootstrap Diagnostic 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-nport-bootstrap-diagnostic-2020.py"
      - ".github/workflows/research-nport-bootstrap-diagnostic-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-nport-bootstrap-diagnostic-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nport-bootstrap-diagnostic-2020
          path: data/research/nport-bootstrap-diagnostic-2020.json
          if-no-files-found: warn
