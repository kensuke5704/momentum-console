name: Research NQ Bridge 2019

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-nq-bridge-2019.py"
      - "scripts/research-nq-nport-overlap-window-2019.py"
      - "scripts/research-nq-parser-pilot.py"
      - ".github/workflows/research-nq-bridge-2019.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-nq-bridge-2019.py
      - run: python3 scripts/research-nq-nport-overlap-window-2019.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-bridge-parser-2019
          path: |
            data/research/nq-bridge-parser-2019.json
            data/research/nq-nport-overlap-window-2019.json
          if-no-files-found: warn
