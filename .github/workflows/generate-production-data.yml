name: Generate Dynamic Strategy Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run sync:universe
      - run: npm run sync:data
      - run: npm run sync:oos
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-production-data
          path: |
            data/sec-nport/filings.json
            data/universe-history.json
            public/data/universe-current.json
            public/data/universe-history.json
            public/data/market-data.json
            public/data/dashboard.json
            public/data/live-state.json
            public/data/oos-performance.json
            public/data/backtest-frozen.json
          retention-days: 30
