name: Fixed60 exact no-churn tax test
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - scripts/fixed60-exact-no-churn-tax.ts
      - .github/workflows/fixed60-exact-no-churn-tax.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-exact-no-churn-tax.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-exact-no-churn-tax-result
          path: data/research/fixed60-exact-no-churn-tax/result.json
