name: Research SEC Complete Portfolio Inventory H1 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-complete-portfolio-inventory-h1-2006.py"
      - ".github/workflows/research-sec-complete-portfolio-inventory-h1-2006.yml"

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build H1 2006 complete-portfolio inventory
        run: python3 scripts/research-sec-complete-portfolio-inventory-h1-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-complete-portfolio-inventory-h1-2006
          path: data/research/sec-complete-portfolio-inventory-h1-2006.json
          if-no-files-found: error
