name: Research Historical Universe Stitch Through H2 2007

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2007-20260908"]
    paths:
      - ".github/workflows/research-historical-universe-stitch-through-h2-2007.yml"
      - "scripts/research-historical-universe-stitch-through-h2-2007.py"
      - "docs/research/h2-2007-24-month-stitch-validation-definition.md"

permissions:
  contents: read
  actions: read

jobs:
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen stitch and builder lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research-historical-universe-builder.py)" = "1357402f34dfea1c1dbdcaac7de5078b680eb5c3"
          test "$(git hash-object scripts/research-historical-universe-stitch-through-h2-2007.py)" = "5d6c98817919277454bdf9dea76281aae6c378c0"
          test "$(git hash-object scripts/research-h2-2007-downstream-period-extension-validation.py)" = "72ae7532458d35e09b4b98bf221fbd566970aa07"
          python3 -m py_compile scripts/research-historical-universe-stitch-through-h2-2007.py

      - name: Download closed 18-month historical Universe prefix
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34186850426
          name: historical-universe-builder-through-h1-2007
          path: data/research

      - name: Download validated H2 2007 downstream output
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34192853738
          name: h2-2007-downstream-period-extension-validation
          path: data/research

      - name: Require fixed H2 validation PASS before stitch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/research/h2-2007-downstream-period-extension-validation.json').read_text())
          assert p['passed'] is True
          assert p['sourceCatalogSha256']=='9ffed81a42044f7388221a60450a24967ea61f108eb63f66464699ada1849631'
          assert p['checks']['frozenBuilderExactParitySixOfSix'] is True
          assert p['checks']['countryNoLookahead'] is True
          assert p['checks']['corpBridgeMaterialityInvariant'] is True
          assert len(p['monthly'])==6
          PY

      - name: Stitch validated historical Universe without recomputation
        run: python3 scripts/research-historical-universe-stitch-through-h2-2007.py

      - name: Audit exact closed prefix and exact validated suffix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          prefix=json.loads(Path('data/research/historical-universe-builder-through-h1-2007.json').read_text())
          suffix=json.loads(Path('data/research/historical-universe-builder-h2-2007.json').read_text())
          out=json.loads(Path('data/research/historical-universe-builder-through-h2-2007.json').read_text())
          rows=out['monthSnapshots']
          expected=[f'2006-{m:02d}' for m in range(1,13)]+[f'2007-{m:02d}' for m in range(1,13)]
          assert [r['signalMonth'] for r in rows]==expected
          assert len(rows)==24
          assert rows[:18]==prefix['monthSnapshots']
          assert rows[18:]==suffix['monthSnapshots']
          assert out['builderGitBlob']=='1357402f34dfea1c1dbdcaac7de5078b680eb5c3'
          assert out['segments'][0]['artifactId']==10040792563
          assert out['segments'][1]['artifactId']==10042811090
          assert out['segments'][1]['runId']==34192853738
          assert all(len(r.get('symbols',[]))<=80 for r in rows)
          print('STITCH_H2_2007_AUDIT',json.dumps({'passed':True,'months':24,'first':rows[0]['signalMonth'],'last':rows[-1]['signalMonth'],'eligibleSourceSeriesCounts':[r.get('eligibleSourceSeriesCount') for r in rows],'universeSizes':[len(r.get('symbols',[])) for r in rows]},separators=(',',':')))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: historical-universe-builder-through-h2-2007
          path: data/research/historical-universe-builder-through-h2-2007.json
          if-no-files-found: error
