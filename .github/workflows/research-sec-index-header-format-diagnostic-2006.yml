name: Research SEC Index Header Format Diagnostic 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-index-header-format-diagnostic-2006.py"
      - ".github/workflows/research-sec-index-header-format-diagnostic-2006.yml"
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run SEC index-header format diagnostic
        run: python3 scripts/research-sec-index-header-format-diagnostic-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-index-header-format-diagnostic-2006
          path: data/research/sec-index-header-format-diagnostic-2006.json
