name: Research Expected CAGR Model

on:
  workflow_dispatch:
  push:
    branches: ["research/expected-cagr-model-20260825"]
    paths:
      - "scripts/expected-cagr-model.ts"
      - ".github/workflows/research-expected-cagr.yml"

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_CAGR_BOOTSTRAPS: 20000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run expected CAGR model
        run: node --import tsx scripts/expected-cagr-model.ts
      - uses: actions/upload-artifact@v4
        with:
          name: expected-cagr-model
          path: data/research/expected-cagr/expected-cagr.json
          retention-days: 30
