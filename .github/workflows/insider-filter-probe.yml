name: Insider filter probe
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/insider-filter-probe.py'
      - '.github/workflows/insider-filter-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/insider-filter-probe.py
