name: Research Production Series Legacy Intersection 2019

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-production-series-legacy-intersection-2019.py"
      - "scripts/research-nq-series-metadata-2006.py"
      - ".github/workflows/research-production-series-legacy-intersection-2019.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intersect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-production-series-legacy-intersection-2019.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-series-legacy-intersection-2019
          path: data/research/production-series-legacy-intersection-2019.json
          if-no-files-found: warn
