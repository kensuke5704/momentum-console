name: ChatGPT Candidate Research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run candidate research
        run: node --import tsx scripts/chatgpt-candidate-research.ts
      - name: Upload candidate research
        uses: actions/upload-artifact@v4
        with:
          name: candidate-research-results
          path: artifacts/candidate-research.json
          if-no-files-found: error
