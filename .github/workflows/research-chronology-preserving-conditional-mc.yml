name: Chronology Preserving Conditional Monte Carlo

on:
  push:
    branches:
      - research/structural-monte-carlo-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline_s20260825
            stop: 0.175
            recovery: 10
            seed: 20260825
          - label: recovery5_s20260825
            stop: 0.175
            recovery: 5
            seed: 20260825
          - label: baseline_s314159
            stop: 0.175
            recovery: 10
            seed: 314159
          - label: recovery5_s314159
            stop: 0.175
            recovery: 5
            seed: 314159
          - label: baseline_s271828
            stop: 0.175
            recovery: 10
            seed: 271828
          - label: recovery5_s271828
            stop: 0.175
            recovery: 5
            seed: 271828
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run chronology-preserving conditional Monte Carlo
        env:
          CPCM_PATHS: 1000
          CPCM_LABEL: ${{ matrix.label }}
          CPCM_STOP: ${{ matrix.stop }}
          CPCM_RECOVERY_DAYS: ${{ matrix.recovery }}
          CPCM_SEED: ${{ matrix.seed }}
        run: node --import tsx scripts/chronology-preserving-conditional-mc.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cpcm-${{ matrix.label }}-1000
          path: data/research/structural-monte-carlo/cpcm-${{ matrix.label }}.json
          retention-days: 30
