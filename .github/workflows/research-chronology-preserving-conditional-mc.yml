name: Chronology Preserving Conditional Monte Carlo

on:
  push:
    branches:
      - research/structural-monte-carlo-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run chronology-preserving conditional Monte Carlo
        env:
          CPCM_PATHS: 500
        run: node --import tsx scripts/chronology-preserving-conditional-mc.ts
      - uses: actions/upload-artifact@v4
        with:
          name: chronology-preserving-conditional-mc-500
          path: data/research/structural-monte-carlo/
          retention-days: 30
