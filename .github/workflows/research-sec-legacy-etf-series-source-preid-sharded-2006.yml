name: Research SEC Legacy ETF Series Source Pre-ID Sharded 2006

on:
  workflow_dispatch:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-legacy-etf-series-source-preid-shard-2006.py"
      - "scripts/research-sec-legacy-etf-series-source-preid-merge-2006.py"
      - ".github/workflows/research-sec-legacy-etf-series-source-preid-sharded-2006.yml"

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed H2/H1 inventories and operational-prefilter inputs
        run: |
          mkdir -p data/research /tmp/h2 /tmp/h1 /tmp/pref
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9963689740/zip > /tmp/h2.zip
          unzip -q /tmp/h2.zip -d /tmp/h2
          cp /tmp/h2/sec-complete-portfolio-inventory-h2-2005.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9963841667/zip > /tmp/h1.zip
          unzip -q /tmp/h1.zip -d /tmp/h1
          cp /tmp/h1/sec-complete-portfolio-inventory-h1-2006.json data/research/
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9962972058/zip > /tmp/pref.zip
          unzip -q /tmp/pref.zip -d /tmp/pref
          cp /tmp/pref/sec-etf-registrant-operational-prefilter-h1-2006.json data/research/
      - name: Resolve strict pre-Series-ID source shard
        run: python3 scripts/research-sec-legacy-etf-series-source-preid-shard-2006.py --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preid-source-shard-${{ matrix.shard }}
          path: data/research/sec-legacy-etf-series-source-preid-2006-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preid-source-shard-*
          path: data/research/preid-shards
          merge-multiple: true
      - name: Merge strict pre-Series-ID source catalog
        run: python3 scripts/research-sec-legacy-etf-series-source-preid-merge-2006.py
      - uses: actions/upload-artifact@v4
        with:
          name: sec-legacy-etf-series-source-preid-2006-sharded
          path: data/research/sec-legacy-etf-series-source-preid-2006.json
          if-no-files-found: error
