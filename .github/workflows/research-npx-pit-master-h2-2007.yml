name: Research N-PX PIT Master H2 2007

on:
  push:
    branches: ["research/strict-series-source-h2-2007-20260908"]
    paths:
      - "docs/research/h2-2007-npx-pit-master-validation-definition.md"
      - "scripts/research-npx-pit-master-h2-2007.py"
      - ".github/workflows/research-npx-pit-master-h2-2007.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-pit-npx-master:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen implementations
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research-npx-security-master-2006.py)" = "bc2d44dda6bfae00ebba22a81ba867a18bbd7ba5"
          test "$(git hash-object scripts/research-npx-security-master-build-2006.py)" = "ad977557eb7f48fc0c0d71a2c369b0d61f6c1239"
          test "$(git hash-object scripts/research-nq-catalog-structural-mapping-h1-2006.py)" = "690479017fc82dce2480ded5d1ffafbb76721722"

      - name: Download frozen pre-2007 N-PX master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/npx-base
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9876020712/zip > /tmp/npx-base.zip
          unzip -q /tmp/npx-base.zip -d /tmp/npx-base
          test -f /tmp/npx-base/npx-security-master-2006.json
          cp /tmp/npx-base/npx-security-master-2006.json data/research/npx-security-master-2006.json
          sha256sum data/research/npx-security-master-2006.json

      - name: Build and validate monthly PIT N-PX masters
        run: python3 scripts/research-npx-pit-master-h2-2007.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npx-pit-master-h2-2007
          path: |
            data/research/npx-pit-master-h2-2007-audit.json
            data/research/npx-pit-master-h2-2007-2007-07.json
            data/research/npx-pit-master-h2-2007-2007-08.json
            data/research/npx-pit-master-h2-2007-2007-09.json
            data/research/npx-pit-master-h2-2007-2007-10.json
            data/research/npx-pit-master-h2-2007-2007-11.json
            data/research/npx-pit-master-h2-2007-2007-12.json
          if-no-files-found: warn
