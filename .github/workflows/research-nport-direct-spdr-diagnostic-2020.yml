name: Research NPORT Direct SPDR Diagnostic 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-nport-direct-spdr-diagnostic-2020.py"
      - ".github/workflows/research-nport-direct-spdr-diagnostic-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-nport-direct-spdr-diagnostic-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nport-direct-spdr-diagnostic-2020
          path: |
            data/research/nport-direct-spdr-diagnostic-2020.json
            data/research/nport-direct-spdr-xlK-20200331-jina.txt
          if-no-files-found: warn
