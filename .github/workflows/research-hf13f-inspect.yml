name: Research HF 13F Mirror Inspect
on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-hf13f-inspect.py"
      - ".github/workflows/research-hf13f-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-hf13f-inspect.py
