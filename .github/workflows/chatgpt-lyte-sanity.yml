name: Temporary LYTE Sanity
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  research:
    if: github.head_ref == 'chatgpt/lyte-sanity-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/chatgpt-lyte-sanity.ts
