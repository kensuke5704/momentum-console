name: Research Universe Boundary Perturbation
on:
  push:
    branches:
      - research/symbol-concentration-audit-20260828
    paths:
      - scripts/audit-universe-boundary.ts
      - .github/workflows/research-universe-boundary.yml
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run Top80 boundary perturbation audit
        run: node --import tsx scripts/audit-universe-boundary.ts
      - uses: actions/upload-artifact@v4
        with:
          name: universe-boundary-perturbation-priced
          path: data/research/universe-boundary-perturbation-priced.json
