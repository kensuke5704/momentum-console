name: Hybrid institutional accumulation screen
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-institutional-accumulation-screen.ts'
      - '.github/workflows/hybrid-institutional-accumulation-screen.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-institutional-accumulation-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-institutional-accumulation-screen-result
          path: data/research/hybrid-institutional-accumulation-screen/result.json
          # rerun 2026-08-30
