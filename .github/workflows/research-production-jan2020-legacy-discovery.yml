name: Research Production Jan2020 Legacy Discovery

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-production-jan2020-legacy-discovery.py"
      - ".github/workflows/research-production-jan2020-legacy-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-production-jan2020-legacy-discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-jan2020-legacy-discovery
          path: data/research/production-jan2020-legacy-discovery.json
          if-no-files-found: warn
