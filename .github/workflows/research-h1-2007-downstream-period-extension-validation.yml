name: Research H1 2007 Downstream Period Extension Validation

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h1-2007-20260908"]
    paths:
      - "docs/research/h1-2007-downstream-run-trigger.md"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen historical builder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research-historical-universe-builder.py)" = "1357402f34dfea1c1dbdcaac7de5078b680eb5c3"

      - name: Download fixed H1 2007 source lineage
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34184083615
          name: sec-id-era-strict-series-source-h1-2007-v3
          path: data/research

      - name: Download parser invariance checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34184619228
          name: nq-holdings-parser-invariance-h2-2006-h1-2007
          path: data/research

      - name: Download frozen H1 2007 mapping
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34184639119
          name: nq-series-id-structural-mapping-h1-2007
          path: data/research

      - name: Download strict PIT country result
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34184751511
          name: nq-series-id-pit-country-h1-2007
          path: data/research

      - name: Verify fixed source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum data/research/sec-id-era-strict-series-source-h1-2007.json | awk '{print $1}')" = "fcf8bd62ff1182f2d8a9dc99c2f6fd30bcf3b3a2974d04786d1a943f1c9fa21b"

      - name: Compile frozen builder and pre-defined validator
        run: |
          python3 -m py_compile scripts/research-historical-universe-builder.py
          python3 -m py_compile scripts/research-h1-2007-downstream-period-extension-validation.py

      - name: Build frozen H1 2007 historical Universe
        run: |
          python3 scripts/research-historical-universe-builder.py \
            --input data/research/nq-series-id-country-pit-h1-2007.json \
            --output data/research/historical-universe-builder-h1-2007.json \
            --expected-catalog-sha fcf8bd62ff1182f2d8a9dc99c2f6fd30bcf3b3a2974d04786d1a943f1c9fa21b

      - name: Require pre-defined H1 2007 downstream invariants
        run: python3 scripts/research-h1-2007-downstream-period-extension-validation.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-2007-downstream-period-extension-validation
          path: |
            data/research/h1-2007-downstream-period-extension-validation.json
            data/research/historical-universe-builder-h1-2007.json
            data/research/sec-id-era-strict-series-source-h1-2007.json
            data/research/nq-holdings-parser-invariance-h2-2006-h1-2007.json
            data/research/nq-series-id-structural-mapping-h1-2007.json
            data/research/nq-series-id-country-pit-h1-2007.json
            data/research/nq-series-id-country-extension-diagnostic-h1-2007.json
          if-no-files-found: error
