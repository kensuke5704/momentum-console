name: Stage21 Overlay Shadow

on:
  push:
    branches: ["research/stage21-overlay-shadow-20260907"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fast shock overlay
        run: node --import tsx scripts/cagr40-fastshock-stage13.ts
      - name: Shock quarantine overlay
        run: node --import tsx scripts/cagr40-shock-quarantine-stage13.ts
      - name: Volatility guard overlay
        run: node --import tsx scripts/cagr40-volatility-guard-stage12.ts
      - name: Volatility target overlay
        run: node --import tsx scripts/cagr40-vol-target-stage17.ts
