name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Calculate frozen rounded Stage21 profit factor
        run: |
          cp scripts/cagr40-sbi-stage18.ts scripts/_stage21-pf.ts
          sed -i 's/IEF/GLDM/g; s/sh:\.074375,c:\.14875/sh:0,c:.22/g; s/sh:\.14875,c:\.2975/sh:0,c:.445/g; s/f:\.7225,g:\.1275/f:.85,g:0/g; s/f:\.425,g:\.1275/f:.555,g:0/g; s/f:\.1275,g:\.1275/f:.255,g:0/g; s/gold:\.1121875,bond:\.1121875/gold:.1125,bond:.1125/g; s/gold:\.149375,bond:\.149375/gold:.15,bond:.15/g' scripts/_stage21-pf.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/_stage21-pf.ts')
          s=p.read_text()
          old='function cotStress(rows:Cot[],date:string){const cut=new Date(date+"T00:00:00Z");cut.setUTCDate(cut.getUTCDate()-7);const ds=rows.filter(x=>x.date<=cut.toISOString().slice(0,10));if(ds.length<5)return false;return ds[ds.length-1].net<ds[ds.length-5].net}'
          new='''const COT_RELEASE_OVERRIDES:Record<string,string>={"2025-09-30":"2025-11-19","2025-10-07":"2025-11-21","2025-10-14":"2025-11-25","2025-10-21":"2025-12-02","2025-10-28":"2025-12-05","2025-11-04":"2025-12-09","2025-11-10":"2025-12-10","2025-11-18":"2025-12-12","2025-11-25":"2025-12-15","2025-12-02":"2025-12-17","2025-12-09":"2025-12-19","2025-12-16":"2025-12-23","2025-12-23":"2025-12-29"};function cotStress(rows:Cot[],date:string){const cut=new Date(date+"T00:00:00Z");cut.setUTCDate(cut.getUTCDate()-7);const cutoff=cut.toISOString().slice(0,10);const ds=rows.filter(x=>x.date<=cutoff&&(!COT_RELEASE_OVERRIDES[x.date]||COT_RELEASE_OVERRIDES[x.date]<=date));if(ds.length<5)return false;return ds[ds.length-1].net<ds[ds.length-5].net}'''
          if old not in s: raise SystemExit('cot pattern not found')
          s=s.replace(old,new)
          # Instrument apply() to capture the rebalance dates of the base run.
          s=s.replace('function apply(f:EquityPoint[]', 'let LAST_REBALANCES:string[]=[];function apply(f:EquityPoint[]')
          s=s.replace('if(rebalance){let total=', 'if(rebalance){LAST_REBALANCES.push(d);let total=')
          oldmain='const cr=await cot();const f=runStrategySimulation({histories:m.histories,universeHistory:us,config:PRODUCTION_STRATEGY}).backtest.equityCurve.filter(x=>x.date>=START&&x.date<=END),g=runG(m.histories,us),gold=asset(m.histories.GLDM),bond=asset(m.histories.GLDM),sh=asset(m.histories.SH),mk=(c=.001,l=0)=>apply(f,g,gold,bond,sh,m.histories.QQQ,cr,c,l),base=mk(),stress=[mk(.003),mk(.001,1),mk(.001,2),trim(mk(),"2021-01-01")],sc=stress.map(x=>performanceStats(x).cagr),rw=rolling36(base),st=performanceStats(base),proxy=Math.min(median(sc),median(rw));console.log(JSON.stringify({architecture:"SBI Stage18: exact Stage15 role substitution",normal:N,yellow:Y,deep:D,rule:"DBMF->50/50 GLDM+GLDM, BTAL->SH; CFTC/M3 frozen",result:{stats:st,stressCAGRs:sc,stressMedianCAGR:median(sc),rolling36MedianCAGR:median(rw),rolling36Worst:Math.min(...rw),planningProxy:proxy,pass:proxy>=.40&&st.maxDrawdown>=-.17}},null,2))'
          if oldmain not in s: raise SystemExit('main pattern not found')
          newmain='''const cr=await cot();const f=runStrategySimulation({histories:m.histories,universeHistory:us,config:PRODUCTION_STRATEGY}).backtest.equityCurve.filter(x=>x.date>=START&&x.date<=END),g=runG(m.histories,us),gold=asset(m.histories.GLDM),bond=asset(m.histories.GLDM),sh=asset(m.histories.SH),mk=(c=.001,l=0)=>apply(f,g,gold,bond,sh,m.histories.QQQ,cr,c,l);LAST_REBALANCES=[];const base=mk();const rebalanceDates=[...LAST_REBALANCES];LAST_REBALANCES=[];const st=performanceStats(base);function pfFromDeltas(ds:number[]){const gp=ds.filter(x=>x>0).reduce((a,b)=>a+b,0),gl=-ds.filter(x=>x<0).reduce((a,b)=>a+b,0);return{profitFactor:gl>0?gp/gl:null,grossProfit:gp,grossLoss:gl,wins:ds.filter(x=>x>0).length,losses:ds.filter(x=>x<0).length,flat:ds.filter(x=>x===0).length}}const daily=pfFromDeltas(base.slice(1).map((x,i)=>x.equity-base[i].equity));const map=new Map(base.map((x,i)=>[x.date,i]));const cuts=[base[0].date,...rebalanceDates.filter((d,i,a)=>d!==base[0].date&&a.indexOf(d)===i),base.at(-1)!.date].sort();const intervals:number[]=[];for(let i=1;i<cuts.length;i++){const a=map.get(cuts[i-1]),b=map.get(cuts[i]);if(a!=null&&b!=null&&b>a)intervals.push(base[b].equity-base[a].equity)}const rebalance=pfFromDeltas(intervals);console.log(JSON.stringify({architecture:"Stage21 rounded v1 release-aware",stats:st,dailyProfitFactor:daily,rebalanceIntervalProfitFactor:rebalance,rebalanceDates:rebalanceDates.length,intervals:intervals.length,definition:{daily:"sum positive daily equity P&L / absolute sum negative daily equity P&L",rebalance:"sum positive equity P&L between monthly/state rebalance dates / absolute sum negative interval P&L"}},null,2))'''
          s=s.replace(oldmain,newmain)
          p.write_text(s)
          PY
          node --import tsx scripts/_stage21-pf.ts
