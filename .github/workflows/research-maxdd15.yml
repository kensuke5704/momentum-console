name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Screen CFTC positioning guard Stage 14
        run: node --import tsx scripts/cagr40-cftc-positioning-stage14.ts
