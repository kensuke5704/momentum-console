name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Screen CFTC OI-normalized Stage 16
        run: |
          cp scripts/cagr40-cftc-yellow-stage15.ts scripts/_stage16-runtime.ts
          sed -i 's/asset_mgr_positions_long/pct_of_oi_asset_mgr_long/g; s/asset_mgr_positions_short/pct_of_oi_asset_mgr_short/g' scripts/_stage16-runtime.ts
          node --import tsx scripts/_stage16-runtime.ts
