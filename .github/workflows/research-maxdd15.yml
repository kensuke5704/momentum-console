name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Screen SBI IEF baseline
        run: node --import tsx scripts/cagr40-sbi-stage18.ts
      - name: Screen SBI SHY substitute
        run: |
          cp scripts/cagr40-sbi-stage18.ts scripts/_sbi-shy.ts
          sed -i 's/IEF/SHY/g' scripts/_sbi-shy.ts
          node --import tsx scripts/_sbi-shy.ts
      - name: Screen SBI TLT substitute
        run: |
          cp scripts/cagr40-sbi-stage18.ts scripts/_sbi-tlt.ts
          sed -i 's/IEF/TLT/g' scripts/_sbi-tlt.ts
          node --import tsx scripts/_sbi-tlt.ts
