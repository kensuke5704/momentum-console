name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Calculate frozen rounded Stage21 annual returns and profit factor
        run: |
          cp scripts/cagr40-sbi-stage18.ts scripts/_stage21-audit.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/_stage21-audit.ts')
          s=p.read_text()
          s=s.replace('const N={f:.7225,g:.1275,gold:.075,bond:.075,sh:0,c:0};const Y={f:.425,g:.1275,gold:.1121875,bond:.1121875,sh:.074375,c:.14875};const D={f:.1275,g:.1275,gold:.149375,bond:.149375,sh:.14875,c:.2975};','const N={f:.85,g:0,gold:.15,bond:0,sh:0,c:0};const Y={f:.555,g:0,gold:.225,bond:0,sh:0,c:.22};const D={f:.255,g:0,gold:.30,bond:0,sh:0,c:.445};')
          old='function cotStress(rows:Cot[],date:string){const cut=new Date(date+"T00:00:00Z");cut.setUTCDate(cut.getUTCDate()-7);const ds=rows.filter(x=>x.date<=cut.toISOString().slice(0,10));if(ds.length<5)return false;return ds[ds.length-1].net<ds[ds.length-5].net}'
          new='''const COT_RELEASE_OVERRIDES:Record<string,string>={"2025-09-30":"2025-11-19","2025-10-07":"2025-11-21","2025-10-14":"2025-11-25","2025-10-21":"2025-12-02","2025-10-28":"2025-12-05","2025-11-04":"2025-12-09","2025-11-10":"2025-12-10","2025-11-18":"2025-12-12","2025-11-25":"2025-12-15","2025-12-02":"2025-12-17","2025-12-09":"2025-12-19","2025-12-16":"2025-12-23","2025-12-23":"2025-12-29"};function cotStress(rows:Cot[],date:string){const cut=new Date(date+"T00:00:00Z");cut.setUTCDate(cut.getUTCDate()-7);const cutoff=cut.toISOString().slice(0,10);const ds=rows.filter(x=>x.date<=cutoff&&(!COT_RELEASE_OVERRIDES[x.date]||COT_RELEASE_OVERRIDES[x.date]<=date));if(ds.length<5)return false;return ds[ds.length-1].net<ds[ds.length-5].net}'''
          if old not in s: raise SystemExit('cot pattern not found')
          s=s.replace(old,new)
          prefix=s.split('async function main(){',1)[0]
          main='''async function main(){const m=JSON.parse(await readFile(resolve("public/data/market-data.json"),"utf8"))as MF,u=JSON.parse(await readFile(resolve("data/universe-history.json"),"utf8"))as UF,us=[...u.history].sort((a,b)=>a.asOf.localeCompare(b.asOf));for(const sym of ["GLDM","SH"]){if(!m.histories[sym]||m.histories[sym].length<200)m.histories[sym]=await fetchYahooHistory(sym)}const cr=await cot(),f=runStrategySimulation({histories:m.histories,universeHistory:us,config:PRODUCTION_STRATEGY}).backtest.equityCurve.filter(x=>x.date>=START&&x.date<=END),g=runG(m.histories,us),gold=asset(m.histories.GLDM),zero=gold.map(x=>({date:x.date,equity:1,drawdown:0})),base=apply(f,g,gold,zero,zero,m.histories.QQQ,cr,.001,0),st=performanceStats(base);const annual:Record<string,number>={};let prior=1;for(const y of [...new Set(base.map(x=>x.date.slice(0,4)))].sort()){const pts=base.filter(x=>x.date.startsWith(y));if(!pts.length)continue;const end=pts.at(-1)!.equity;annual[y]=end/prior-1;prior=end}const ds=base.slice(1).map((x,i)=>x.equity-base[i].equity),gp=ds.filter(x=>x>0).reduce((a,b)=>a+b,0),gl=-ds.filter(x=>x<0).reduce((a,b)=>a+b,0);console.log(JSON.stringify({architecture:"Stage21 rounded v1 release-aware",dataThrough:END,annualReturns:annual,dailyProfitFactor:gl?gp/gl:null,stats:st},null,2))}main().catch(e=>{console.error(e);process.exitCode=1});'''
          p.write_text(prefix+main)
          PY
          node --import tsx scripts/_stage21-audit.ts
