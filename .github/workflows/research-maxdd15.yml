name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stress rounded Stage21 across implementation and time
        run: |
          make_base () {
            cp scripts/cagr40-sbi-stage18.ts "$1"
            sed -i 's/IEF/GLDM/g; s/sh:\.074375,c:\.14875/sh:0,c:.22/g; s/sh:\.14875,c:\.2975/sh:0,c:.445/g; s/f:\.7225,g:\.1275/f:.85,g:0/g; s/f:\.425,g:\.1275/f:.555,g:0/g; s/f:\.1275,g:\.1275/f:.255,g:0/g; s/gold:\.1121875,bond:\.1121875/gold:.1125,bond:.1125/g; s/gold:\.149375,bond:\.149375/gold:.15,bond:.15/g' "$1"
          }

          make_base scripts/_s0-base.ts
          echo '=== S0 BASE ==='
          node --import tsx scripts/_s0-base.ts

          make_base scripts/_s1-cost50.ts
          sed -i 's/stress=\[mk(.003)/stress=[mk(.005)/' scripts/_s1-cost50.ts
          echo '=== S1 COST 50BP ==='
          node --import tsx scripts/_s1-cost50.ts

          make_base scripts/_s2-cost100.ts
          sed -i 's/stress=\[mk(.003)/stress=[mk(.010)/' scripts/_s2-cost100.ts
          echo '=== S2 COST 100BP ==='
          node --import tsx scripts/_s2-cost100.ts

          make_base scripts/_s3-lag3.ts
          sed -i 's/mk(.001,1),mk(.001,2)/mk(.001,3),mk(.001,2)/' scripts/_s3-lag3.ts
          echo '=== S3 LAG +3 ==='
          node --import tsx scripts/_s3-lag3.ts

          make_base scripts/_s4-lag5.ts
          sed -i 's/mk(.001,1),mk(.001,2)/mk(.001,5),mk(.001,2)/' scripts/_s4-lag5.ts
          echo '=== S4 LAG +5 ==='
          node --import tsx scripts/_s4-lag5.ts

          make_base scripts/_s5-start2022.ts
          sed -i 's/trim(mk(),"2021-01-01")/trim(mk(),"2022-01-01")/' scripts/_s5-start2022.ts
          echo '=== S5 START 2022 ==='
          node --import tsx scripts/_s5-start2022.ts

          make_base scripts/_s6-start2023.ts
          sed -i 's/trim(mk(),"2021-01-01")/trim(mk(),"2023-01-01")/' scripts/_s6-start2023.ts
          echo '=== S6 START 2023 ==='
          node --import tsx scripts/_s6-start2023.ts
