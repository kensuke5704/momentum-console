name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Screen SBI GLDM-only cash defense with G sleeve reassigned to Fixed60
        run: |
          cp scripts/cagr40-sbi-stage18.ts scripts/_sbi-gold-nog.ts
          sed -i 's/IEF/GLDM/g; s/sh:\.074375,c:\.14875/sh:0,c:.223125/g; s/sh:\.14875,c:\.2975/sh:0,c:.44625/g; s/f:\.7225,g:\.1275/f:.85,g:0/g; s/f:\.425,g:\.1275/f:.5525,g:0/g; s/f:\.1275,g:\.1275/f:.255,g:0/g' scripts/_sbi-gold-nog.ts
          node --import tsx scripts/_sbi-gold-nog.ts
