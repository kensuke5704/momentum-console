name: Research CAGR40 New Alpha

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Screen SBI GLDM+SLV with SHY defense
        run: |
          cp scripts/cagr40-sbi-stage18.ts scripts/_sbi-slv-shy.ts
          sed -i 's/IEF/SLV/g; s/"SH"\]/"SHY"\]/g; s/m\.histories\.SH)/m.histories.SHY)/g' scripts/_sbi-slv-shy.ts
          node --import tsx scripts/_sbi-slv-shy.ts
