name: Research CAGR40 Orthogonal Engines

on:
  push:
    branches: ["research/cagr40-orthogonal-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Screen late tail Stage 8
        run: node --import tsx scripts/cagr40-late-tail-stage8.ts
