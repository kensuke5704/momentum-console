name: Fix generatedAt display

on:
  push:
    branches: [fix/persist-generated-at-display-20260829]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch refresh timestamp semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/momentum-app.tsx')
          text = path.read_text()
          old = '      setData(body.dashboard);\n      setLastLoadedAt(new Date().toISOString());\n      if (interactive) setRefreshMessage(`GitHub Actions生成版を取得しました（${date(body.dashboard.generatedAt.slice(0, 10))}）。`);'
          new = '      setData(body.dashboard);\n      setLastLoadedAt(body.dashboard.generatedAt);\n      if (interactive) setRefreshMessage(`GitHub Actions生成版を取得しました（${updatedAt(body.dashboard.generatedAt)}）。`);'
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/momentum-app.tsx
          git commit -m "fix: keep displayed update time tied to generated data"
          git push
