name: Research Layline 13F NPORT Overlap

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-layline-nport-overlap.py"
      - "scripts/research-layline-signal-agreement.ts"
      - ".github/workflows/research-layline-overlap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Layline 13F vs NPORT 2020 overlap pilot
        run: python3 scripts/research-layline-nport-overlap.py
      - name: Measure production Top2 signal retention
        run: node --import tsx scripts/research-layline-signal-agreement.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layline13f-nport-overlap-2020
          path: |
            data/research/layline13f-nport-overlap-2020.json
            data/research/layline13f-signal-agreement-2020.json
          if-no-files-found: warn
