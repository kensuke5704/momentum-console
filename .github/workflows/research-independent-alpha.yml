name: Research Independent Alpha

on:
  push:
    branches: ["research/independent-alpha-engine-20260901"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Stage 3 structural candidates
        run: node --import tsx scripts/independent-alpha-stage3.ts
