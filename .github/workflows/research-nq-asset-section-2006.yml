name: Research NQ Asset Section 2006

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-nq-asset-section-2006.py"
      - ".github/workflows/research-nq-asset-section-2006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build N-Q asset section attribution
        run: python3 scripts/research-nq-asset-section-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nq-asset-section-2006
          path: data/research/nq-asset-section-2006.json
          if-no-files-found: warn
