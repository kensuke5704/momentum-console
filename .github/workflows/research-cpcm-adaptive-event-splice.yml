name: Research CPCM Adaptive Event Splice

on:
  workflow_dispatch:
  push:
    branches: ["research/cpcm-validity-audit-20260825"]
    paths:
      - "scripts/cpcm-adaptive-event-splice.ts"
      - ".github/workflows/research-cpcm-adaptive-event-splice.yml"

permissions:
  contents: read

jobs:
  adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CPCM_ADAPTIVE_PATHS: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run adaptive trigger-aligned CPCM splice
        run: node --import tsx scripts/cpcm-adaptive-event-splice.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cpcm-adaptive-event-splice
          path: data/research/cpcm-validity/adaptive-event-splice.json
          retention-days: 30
