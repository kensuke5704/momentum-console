name: Research NPORT Bootstrap Schema 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-nport-bootstrap-schema-2020.py"
      - ".github/workflows/research-nport-bootstrap-schema-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frozen N-PORT structural identity fields
        run: python3 scripts/research-nport-bootstrap-schema-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nport-bootstrap-schema-2020
          path: data/research/nport-bootstrap-schema-2020.json
          if-no-files-found: warn
