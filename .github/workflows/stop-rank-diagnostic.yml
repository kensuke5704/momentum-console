name: Stop rank diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/stop-rank-diagnostic.ts'
      - '.github/workflows/stop-rank-diagnostic.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/stop-rank-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: stop-rank-diagnostic-result
          path: data/research/stop-rank-diagnostic/result.json
