name: Hybrid individual stop necessity
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/hybrid-individual-stop-necessity.ts'
      - '.github/workflows/hybrid-individual-stop-necessity.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/hybrid-individual-stop-necessity.ts
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-individual-stop-necessity-result
          path: data/research/hybrid-individual-stop-necessity/result.json