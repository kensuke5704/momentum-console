name: Research Gate B Production Source Legacy Discovery 2020

on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-gate-b-production-source-legacy-discovery-2020.py"
      - ".github/workflows/research-gate-b-production-source-legacy-discovery-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-gate-b-production-source-legacy-discovery-2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-b-production-source-legacy-discovery-2020
          path: data/research/gate-b-production-source-legacy-discovery-2020.json
          if-no-files-found: warn
