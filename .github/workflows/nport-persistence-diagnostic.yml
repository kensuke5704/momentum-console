name: N-PORT persistence diagnostic
on:
  push:
    branches: [research/anchored-walkforward-20260830]
    paths:
      - 'scripts/nport-persistence-diagnostic.ts'
      - '.github/workflows/nport-persistence-diagnostic.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/nport-persistence-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: nport-persistence-diagnostic-result
          path: data/research/nport-persistence-diagnostic/result.json
