name: Research H2 2006 Downstream Period Extension Validation

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2006-20260908"]
    paths:
      - ".github/workflows/research-h2-2006-downstream-period-extension-validation.yml"
      - "scripts/research-h2-2006-downstream-period-extension-validation.py"
      - "docs/research/h2-2006-downstream-period-extension-validation-definition.md"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert frozen implementation blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/research-historical-universe-builder.py)" = "1357402f34dfea1c1dbdcaac7de5078b680eb5c3"
          test "$(git hash-object scripts/research-h2-2006-downstream-period-extension-validation.py)" = "2e191eed5d2d63f515e7e4f8c14d4be6fdb9499a"

      - name: Download fixed parser-invariance and H2 country artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/research /tmp/parser /tmp/country

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10039022796/zip > /tmp/parser.zip
          unzip -q /tmp/parser.zip -d /tmp/parser
          cp /tmp/parser/nq-holdings-parser-invariance-h1-h2-2006.json data/research/

          gh api /repos/kensuke5704/momentum-console/actions/artifacts/10039353878/zip > /tmp/country.zip
          unzip -q /tmp/country.zip -d /tmp/country
          cp /tmp/country/nq-series-id-country-pit-h2-2006.json data/research/
          cp /tmp/country/nq-series-id-country-extension-diagnostic-h2-2006.json data/research/
          cp /tmp/country/nq-series-id-structural-mapping-h2-2006.json data/research/

      - name: Compile frozen builder and validation
        run: |
          python3 -m py_compile scripts/research-historical-universe-builder.py
          python3 -m py_compile scripts/research-h2-2006-downstream-period-extension-validation.py

      - name: Build frozen H2 historical Universe
        run: |
          python3 scripts/research-historical-universe-builder.py \
            --input data/research/nq-series-id-country-pit-h2-2006.json \
            --output data/research/historical-universe-builder-h2-2006.json \
            --expected-catalog-sha f79f8d9e6d7fe45cb115a9c7f087dcca00622ff602cc0147e70e860f3528417d

      - name: Require exact H2 downstream period-extension invariants
        run: python3 scripts/research-h2-2006-downstream-period-extension-validation.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-2006-downstream-period-extension-validation
          path: |
            data/research/h2-2006-downstream-period-extension-validation.json
            data/research/historical-universe-builder-h2-2006.json
            data/research/nq-holdings-parser-invariance-h1-h2-2006.json
            data/research/nq-series-id-country-pit-h2-2006.json
            data/research/nq-series-id-country-extension-diagnostic-h2-2006.json
            data/research/nq-series-id-structural-mapping-h2-2006.json
          if-no-files-found: error
