name: Fixed60 JPY wealth diagnostic

on:
  push:
    branches:
      - research/anchored-walkforward-20260830
    paths:
      - scripts/fixed60-jpy-wealth-diagnostic.ts
      - .github/workflows/fixed60-jpy-wealth-diagnostic.yml
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fixed60-jpy-wealth-diagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fixed60-jpy-wealth-diagnostic-result
          path: data/research/fixed60-jpy-wealth-diagnostic/result.json
