name: Research CPCM Event-Aware Variants

on:
  workflow_dispatch:
  push:
    branches: ["research/cpcm-validity-audit-20260825"]
    paths:
      - "scripts/cpcm-event-aware-variants.ts"
      - ".github/workflows/research-cpcm-event-aware-variants.yml"

permissions:
  contents: read

jobs:
  event-aware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CPCM_EVENT_AWARE_PATHS: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run event-aware CPCM variants
        run: node --import tsx scripts/cpcm-event-aware-variants.ts
      - uses: actions/upload-artifact@v4
        with:
          name: cpcm-event-aware-variants
          path: data/research/cpcm-validity/event-aware-variants.json
          retention-days: 30
