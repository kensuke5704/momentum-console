name: Signal Perturbation

on:
  push:
    branches:
      - research/signal-perturbation-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run signal weight perturbation
        run: node --import tsx scripts/signal-weight-perturbation.ts
      - uses: actions/upload-artifact@v4
        with:
          name: signal-perturbation
          path: data/research/signal-perturbation/
          retention-days: 30
