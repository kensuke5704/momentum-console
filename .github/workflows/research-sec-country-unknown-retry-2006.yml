name: Research SEC Country Unknown Retry 2006
on:
  push:
    branches: ["research/nq-npx-mapping-2006-20260903"]
    paths:
      - "scripts/research-sec-country-unknown-retry-shard-2006.py"
      - ".github/workflows/research-sec-country-unknown-retry-2006.yml"
permissions:
  actions: read
  contents: read
jobs:
  retry:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen country evidence cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/research /tmp/a
          gh api /repos/kensuke5704/momentum-console/actions/artifacts/9899752236/zip > /tmp/a/cache.zip
          unzip -qo /tmp/a/cache.zip -d data/research
      - run: python3 scripts/research-sec-country-unknown-retry-shard-2006.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-country-unknown-retry-${{ matrix.shard }}-2006
          path: data/research/sec-country-unknown-retry-*-2006.json
          if-no-files-found: warn
