name: Research N-Q Holdings Parser Invariance H1 H2 2007

on:
  workflow_dispatch:
  push:
    branches: ["research/strict-series-source-h2-2007-20260908"]
    paths:
      - "scripts/research-nq-holdings-parser-invariance-h1-h2-2007.py"
      - ".github/workflows/research-nq-holdings-parser-invariance-h1-h2-2007.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download closed H1 2007 source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34184083615
          name: sec-id-era-strict-series-source-h1-2007-v3
          path: data/research
      - name: Download closed H1 2007 holdings
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34184472191
          name: nq-pit-holdings-series-id-h1-2007
          path: data/research
      - name: Download validated H2 2007 source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34188233028
          name: sec-id-era-strict-series-source-h2-2007-v4
          path: data/research
      - name: Download H2 2007 holdings
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34188353154
          name: nq-pit-holdings-series-id-h2-2007
          path: data/research
      - name: Verify fixed H2 source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum data/research/sec-id-era-strict-series-source-h2-2007.json | awk '{print $1}')" = "9ffed81a42044f7388221a60450a24967ea61f108eb63f66464699ada1849631"
      - name: Require parser invariance on all shared source filings
        run: python3 scripts/research-nq-holdings-parser-invariance-h1-h2-2007.py
      - uses: actions/upload-artifact@v4
        with:
          name: nq-holdings-parser-invariance-h1-h2-2007
          path: data/research/nq-holdings-parser-invariance-h1-h2-2007.json
          if-no-files-found: error
