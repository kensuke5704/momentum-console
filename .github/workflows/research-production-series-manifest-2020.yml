name: Research Production Series Manifest 2020

on:
  push:
    branches: ["research/cagr40-new-alpha-20260901"]
    paths:
      - "scripts/research-production-series-manifest-2020.py"
      - ".github/workflows/research-production-series-manifest-2020.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/research-production-series-manifest-2020.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-series-manifest-2020
          path: data/research/production-series-manifest-2020.json
