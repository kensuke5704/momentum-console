name: Dynamic exposure screening research
on:
  push:
    branches: [research/anchored-walkforward-20260830]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/dynamic-exposure-screen.ts
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-exposure-screen-result
          path: data/research/dynamic-exposure-screen/result.json
