<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Atlas — 3D Equity Space</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260822-2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260822-2" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Market Atlas ホーム"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>MARKET ATLAS</span></a>
        <div class="top-actions"><button class="icon-btn" id="resetView" aria-label="表示をリセット">↺</button></div>
      </header>

      <section class="workspace">
        <aside class="left-panel">
          <div class="panel-heading"><span class="panel-title">MODEL UNIVERSE</span><button id="filterToggle">THEMES <b>⌄</b></button></div>
          <button class="universe active" data-universe="momentum"><span class="dot us"></span><span>Dynamic Universe</span><em>80</em></button>

          <div class="filter-box" id="filterBox">
            <p>THEME CLUSTERS</p>
            <div class="lens-list">
              <button class="lens active" data-lens="all"><span></span>全セクター</button>
              <button class="lens" data-lens="ai"><span></span>AI・半導体・インフラ</button>
              <button class="lens" data-lens="frontier"><span></span>宇宙・量子・ロボティクス</button>
              <button class="lens" data-lens="security"><span></span>防衛・サイバーセキュリティ</button>
              <button class="lens" data-lens="power"><span></span>原子力・電力インフラ</button>
              <button class="lens" data-lens="crypto"><span></span>暗号資産</button>
              <button class="lens" data-lens="other"><span></span>その他</button>
            </div>
          </div>

        </aside>

        <section class="atlas-stage">
          <canvas id="marketCanvas" aria-label="株式市場の3D関係性マップ"></canvas>
          <div class="crosshair"><span></span><span></span></div>
        </section>

        <aside class="right-panel" id="detailPanel">
          <div class="empty-detail" id="emptyDetail"><div class="empty-ring"></div><p>銘柄を選択すると<br />関係性を詳しく表示します</p></div>
          <div class="stock-detail hidden" id="stockDetail">
            <div class="detail-top"><span id="detailSector">TECHNOLOGY</span><button id="closeDetail" aria-label="閉じる">×</button></div>
            <p class="ticker" id="detailTicker">7203</p><h2 id="detailName">トヨタ自動車</h2>
            <div class="price-row"><strong id="detailPrice">¥2,784</strong><span id="detailChange">+1.82%</span></div>
            <div class="mini-chart"><svg viewBox="0 0 300 76" preserveAspectRatio="none"><g id="chartCandles"></g></svg><div class="chart-periods"><button class="chart-period" data-range="1D">1D</button><button class="chart-period active" data-range="1M">1M</button><button class="chart-period" data-range="1Y">1Y</button></div></div>
            <div class="detail-divider"></div>
            <div class="similar-head"><p>NEAREST NEIGHBORS</p><span>SIMILARITY</span></div><div class="similar-list" id="similarList"></div>
            <a class="inspect" id="inspectLink" href="https://finance.yahoo.com" target="_blank" rel="noopener noreferrer">銘柄を詳しく見る <b>↗</b></a>
          </div>
        </aside>
      </section>

      <footer class="statusbar"><div><span class="pulse"></span> MOMENTUM UNIVERSE <i></i> <b id="nodeCount">80</b> NODES</div><div>SPACE MODEL v2.0 <i></i> TEXT CO-OCCURRENCE</div><div>RELATEDNESS <span class="gradient-scale"></span></div></footer>
    </main>
    <script src="app.js?v=20260822-2"></script>
    <script>
      const atlasCanvas = document.getElementById("marketCanvas");
      const applyDefaultZoom = () => atlasCanvas.dispatchEvent(new WheelEvent("wheel", { deltaY: window.matchMedia("(max-width: 767px)").matches ? -220 : -330, cancelable: true }));
      applyDefaultZoom();
      document.getElementById("resetView").addEventListener("click", applyDefaultZoom);
      atlasCanvas.addEventListener("wheel", (event) => {
        if (event.isTrusted) atlasCanvas.dispatchEvent(new WheelEvent("wheel", { deltaY: event.deltaY * 2, cancelable: true }));
      });
      if (window.matchMedia("(max-width: 767px)").matches) {
        document.getElementById("filterBox").classList.add("hidden");
        const touchPoints = new Map();
        let pinchDistance = null;
        let touchPinchActive = false;
        let lastTouch = null;
        const distance = () => {
          const [first, second] = [...touchPoints.values()];
          return first && second ? Math.hypot(first.x - second.x, first.y - second.y) : null;
        };
        atlasCanvas.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "touch") return;
          touchPoints.set(event.pointerId, { x: event.clientX, y: event.clientY });
          pinchDistance = distance();
        }, true);
        atlasCanvas.addEventListener("pointermove", (event) => {
          if (event.pointerType !== "touch" || !touchPoints.has(event.pointerId)) return;
          event.stopImmediatePropagation();
        }, true);
        const releaseTouch = (event) => { touchPoints.delete(event.pointerId); pinchDistance = distance(); };
        atlasCanvas.addEventListener("pointerup", releaseTouch, true);
        atlasCanvas.addEventListener("pointercancel", releaseTouch, true);
        const touchDistance = (touches) => Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        atlasCanvas.addEventListener("touchstart", (event) => {
          if (event.touches.length === 1) { touchPinchActive = false; lastTouch = { x: event.touches[0].clientX, y: event.touches[0].clientY }; }
          if (event.touches.length === 2) { touchPinchActive = true; lastTouch = null; pinchDistance = touchDistance(event.touches); }
        }, { passive: false });
        atlasCanvas.addEventListener("touchmove", (event) => {
          event.preventDefault();
          if (event.touches.length === 1 && lastTouch) {
            const touch = event.touches[0];
            rotateScreenZ((touch.clientX - lastTouch.x) * .008);
            rotateScreenX((touch.clientY - lastTouch.y) * .008);
            lastTouch = { x: touch.clientX, y: touch.clientY };
            draw();
            return;
          }
          if (!touchPinchActive || event.touches.length !== 2) return;
          const nextDistance = touchDistance(event.touches);
          atlasCanvas.dispatchEvent(new WheelEvent("wheel", { deltaY: (pinchDistance - nextDistance) * 5, cancelable: true }));
          pinchDistance = nextDistance;
        }, { passive: false });
        atlasCanvas.addEventListener("touchend", (event) => { touchPinchActive = event.touches.length === 2; lastTouch = event.touches.length === 1 ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null; }, { passive: false });
        atlasCanvas.addEventListener("touchcancel", () => { touchPinchActive = false; lastTouch = null; }, { passive: false });
      }
    </script>
  </body>
</html>
